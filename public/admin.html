<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Маркетинговый Хаб | Доброе_дело.by</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #0f0f12;
            color: #e1e4e8;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }
        .sidebar {
            width: 280px;
            background: #1a1a1f;
            border-right: 1px solid #2a2a30;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            flex-shrink: 0;
        }
        .logo {
            padding: 24px 20px;
            font-size: 20px;
            font-weight: 800;
            border-bottom: 1px solid #2a2a30;
        }
        .logo span { color: #4f46e5; }
        .nav-item {
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: 0.2s;
            color: #9ca3af;
            font-weight: 500;
            font-size: 13px;
        }
        .nav-item:hover, .nav-item.active {
            background: #2a2a30;
            color: #fff;
            border-left: 3px solid #4f46e5;
        }
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .top-bar {
            padding: 16px 24px;
            background: #1a1a1f;
            border-bottom: 1px solid #2a2a30;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }
        .card {
            background: #1a1a1f;
            border: 1px solid #2a2a30;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 24px;
        }
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }
        .kpi-card {
            background: #1a1a1f;
            border: 1px solid #2a2a30;
            border-radius: 20px;
            padding: 20px;
            transition: all 0.2s;
        }
        .kpi-card:hover {
            border-color: #4f46e5;
            transform: translateY(-2px);
        }
        .kpi-title {
            font-size: 11px;
            text-transform: uppercase;
            color: #9ca3af;
            letter-spacing: 1px;
        }
        .kpi-value {
            font-size: 28px;
            font-weight: 800;
            margin: 8px 0;
        }
        .chart-container {
            height: 300px;
            margin-bottom: 24px;
        }
        .two-columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            text-align: left;
            padding: 10px 8px;
            border-bottom: 1px solid #2a2a30;
            font-size: 13px;
        }
        th {
            color: #9ca3af;
            font-weight: 500;
        }
        .badge {
            background: #4f46e5;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            display: inline-block;
        }
        .badge-success { background: #10b981; }
        .badge-warning { background: #f59e0b; }
        .badge-danger { background: #ef4444; }
        .btn {
            background: #4f46e5;
            border: none;
            padding: 8px 14px;
            border-radius: 10px;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 500;
            font-size: 12px;
        }
        .btn:hover { background: #6366f1; }
        .btn-secondary {
            background: #2a2a30;
            border: 1px solid #3a3a42;
        }
        .btn-secondary:hover { background: #3a3a42; }
        .live-feed {
            height: 500px;
            overflow-y: auto;
        }
        .feed-item {
            padding: 10px 12px;
            border-left: 3px solid #4f46e5;
            background: rgba(79,70,229,0.05);
            margin-bottom: 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 12px;
        }
        .feed-item:hover { background: rgba(79,70,229,0.1); }
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: #1a1a1f;
            border-radius: 20px;
            width: 90%;
            max-width: 550px;
            max-height: 90vh;
            overflow: auto;
            padding: 24px;
        }
        select, input, textarea {
            background: #0f0f12;
            border: 1px solid #2a2a30;
            padding: 8px 12px;
            border-radius: 8px;
            color: white;
            font-size: 13px;
            width: 100%;
        }
        .field { margin-bottom: 16px; }
        .field label { display: block; margin-bottom: 6px; font-size: 12px; color: #9ca3af; }
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .two-columns { grid-template-columns: 1fr; }
        }

        .chart-container {
            position: relative; /* КРИТИЧЕСКИ ВАЖНО для Chart.js */
            width: 100%;
            height: 300px;
            margin-bottom: 24px;
        }
    </style>
</head>
<body>
<div class="sidebar">
    <div class="logo">Доброе_дело<span>.by</span></div>
    <div class="nav-item active" data-tab="dashboard">📊 Пульс системы</div>
    <div class="nav-item" data-tab="userMetrics">🧑‍🤝‍🧑 Пользователи</div>
    <div class="nav-item" data-tab="projectMetrics">🗂 Проекты</div>
    <div class="nav-item" data-tab="participationMetrics">🕒 Участие</div>
    <div class="nav-item" data-tab="qualityMetrics">⭐ Качество</div>
    <div class="nav-item" data-tab="activityMetrics">📈 Активность</div>
    <div class="nav-item" data-tab="communicationsMetrics">💬 Коммуникации</div>
    <div class="nav-item" data-tab="operationalMetrics">🔧 Операционные</div>
    <div class="nav-item" data-tab="efficiencyMetrics">🎯 Эффективность</div>
    <div class="nav-item" data-tab="analytics">📈 Аналитика каналов</div>
    <div class="nav-item" data-tab="segments">🎯 Сегментация</div>
    <div class="nav-item" data-tab="communications">✉️ Рассылки</div>
    <div class="nav-item" data-tab="landings">🌐 Лендинги</div>
    <div class="nav-item" data-tab="abtests">🧪 А/Б тесты</div>
    <div class="nav-item" data-tab="monitoring">🔧 Мониторинг</div>
    <div style="flex:1"></div>
    <div class="nav-item" id="goToMainBtn" style="color:#4f46e5;">🏠 На главную</div>
    <div class="nav-item" id="logoutBtn" style="color:#ef4444;">🚪 Выйти</div>
</div>
<div class="main">
    <div class="top-bar">
        <h2 id="pageTitle">Пульс системы</h2>
        <div>⚡ Маркетинговый хаб</div>
    </div>
    <div class="content" id="content"></div>
</div>

<script>
    const API_BASE = '';
    let currentTab = 'dashboard';
    let liveFeedInterval = null;
    let regChart = null;

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    async function apiFetch(url, options = {}) {
        const token = localStorage.getItem('token') || localStorage.getItem('authToken');
        const headers = {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`,
            ...options.headers
        };
        const res = await fetch(url, { ...options, headers });
        if (res.status === 401) {
            logout();
            throw new Error('Сессия истекла');
        }
        return res.json();
    }

    function logout() {
        localStorage.clear();
        window.location.href = '/';
    }

    function goToMain() {
        window.location.href = '/';
    }

    function showModal(title, html) {
        const modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML = `
            <div class="modal-content">
                <h3 style="margin-bottom: 20px;">${title}</h3>
                ${html}
                <div style="margin-top: 20px; text-align: right;">
                    <button class="btn-secondary" onclick="this.closest('.modal').remove()">Закрыть</button>
                </div>
            </div>
        `;
        document.body.appendChild(modal);
    }

    window.openPublicProfile = async function(userId) {
        try {
            const data = await apiFetch(`/api/admin/user/${userId}`);
            if (data.success && data.user) {
                const u = data.user;
                showModal('Профиль пользователя', `
                    <div style="text-align: center;">
                        <div style="font-size: 64px; margin-bottom: 16px;">👤</div>
                        <h3>${escapeHtml(u.name || u.email)}</h3>
                        <p style="color: #9ca3af;">${u.role === 'VOLUNTEER' ? 'Волонтёр' : u.role === 'ORGANIZER' ? 'Организатор' : 'Администратор'}</p>
                        <div style="text-align: left; margin-top: 20px;">
                            <p><strong>📧 Email:</strong> ${escapeHtml(u.email || '—')}</p>
                            <p><strong>📍 Город:</strong> ${escapeHtml(u.city || '—')}</p>
                            <p><strong>📱 Телефон:</strong> ${escapeHtml(u.phone || '—')}</p>
                            <p><strong>⭐ Опыт (XP):</strong> ${u.points || 0}</p>
                            <p><strong>📅 Регистрация:</strong> ${new Date(u.createdAt).toLocaleString()}</p>
                        </div>
                    </div>
                `);
            } else alert('Не удалось загрузить профиль');
        } catch (err) { alert('Ошибка загрузки профиля'); }
    };

    // ===================== ДАШБОРД =====================
    async function renderDashboard() {
        document.getElementById('pageTitle').innerText = 'Пульс системы';
        document.getElementById('content').innerHTML = `
        <div style="margin-bottom: 30px;">
            <h3 style="margin-bottom: 16px; color: #fff; display: flex; align-items: center; gap: 8px;">👥 Аудитория платформы</h3>
            <div class="kpi-grid" id="kpiAudience">Загрузка...</div>
        </div>

        <div style="margin-bottom: 30px;">
            <h3 style="margin-bottom: 16px; color: #fff; display: flex; align-items: center; gap: 8px;">⚡ Эффективность и Вовлеченность</h3>
            <div class="kpi-grid" id="kpiEngagement">Загрузка...</div>
        </div>

        <div style="margin-bottom: 30px;">
            <h3 style="margin-bottom: 16px; color: #fff; display: flex; align-items: center; gap: 8px;">🗂 Здоровье проектов</h3>
            <div class="kpi-grid" id="kpiProjects">Загрузка...</div>
        </div>


        <div style="margin-bottom: 30px;">
            <h3 style="margin-bottom: 16px; color: #fff; display: flex; align-items: center; gap: 8px;">📍 География охвата (Топ городов)</h3>
            <div class="card" style="padding: 0; overflow: hidden;">
                <table id="geoTable" style="margin-bottom: 0;">
                    <thead>
                        <tr>
                            <th>Город / Регион</th>
                            <th>Волонтёры</th>
                            <th>Активные проекты</th>
                            <th>Доля от общей базы</th>
                        </tr>
                    </thead>
                    <tbody id="geoTableBody">
                        <tr><td colspan="4" style="text-align:center; padding:20px;">Загрузка данных по городам...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="card" style="position: relative;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <h3>📈 Динамика регистраций</h3>
                <div style="display: flex; gap: 8px;">
                    <button class="btn btn-secondary period-btn" data-period="week">Неделя</button>
                    <button class="btn btn-secondary period-btn" data-period="month">Месяц</button>
                </div>
            </div>
            <div class="chart-container" style="position: relative; height: 300px; width: 100%;">
                <canvas id="regChart"></canvas>
            </div>
        </div>

        <div class="two-columns">
            <div class="card">
                <h3>🔥 Живая активность</h3>
                <div id="liveFeed" class="live-feed">Ожидание данных...</div>
            </div>
            <div class="card">
                <h3>📊 Воронка пользователя (Конверсия)</h3>
                <div id="funnelContainer" style="margin-top: 20px;"></div>
            </div>
        </div>
    `;

        const kpi = await apiFetch('/api/admin/dashboard/kpi');
        if (kpi.success) {
            // Блок 1: Аудитория
            document.getElementById('kpiAudience').innerHTML = `
            <div class="kpi-card"><div class="kpi-title">Всего пользователей</div><div class="kpi-value">${kpi.totalUsers}</div><div style="font-size:11px; color:#9ca3af;">База аккаунтов</div></div>
            <div class="kpi-card" style="border-bottom: 3px solid #4f46e5;"><div class="kpi-title">Волонтёры</div><div class="kpi-value">${kpi.totalVolunteers}</div><div style="font-size:11px; color:#10b981;">+${kpi.new7d} за неделю</div></div>
            <div class="kpi-card" style="border-bottom: 3px solid #f59e0b;"><div class="kpi-title">Организаторы</div><div class="kpi-value">${kpi.totalOrganizers}</div><div style="font-size:11px; color:#9ca3af;">Создатели проектов</div></div>
            <div class="kpi-card"><div class="kpi-title">Уникальные (DAU)</div><div class="kpi-value">${kpi.dau}</div><div style="font-size:11px; color:#10b981;">Заходили сегодня</div></div>
        `;

            // Блок 2: Эффективность
            document.getElementById('kpiEngagement').innerHTML = `
            <div class="kpi-card"><div class="kpi-title">Retention (Удержание)</div><div class="kpi-value">${kpi.retentionRate}%</div><div style="font-size:11px; color:#9ca3af;">Вернулись через 7 дней</div></div>
            <div class="kpi-card"><div class="kpi-title">Конверсия в отклик</div><div class="kpi-value">${kpi.ctr}%</div><div style="font-size:11px; color:#9ca3af;">Просмотр → Пойду</div></div>
            <div class="kpi-card"><div class="kpi-title">Явка (Show-up rate)</div><div class="kpi-value">${kpi.showUpRate}%</div><div style="font-size:11px; color:#f59e0b;">Дошли до проекта</div></div>
            <div class="kpi-card"><div class="kpi-title">Social LTV</div><div class="kpi-value">${kpi.avgHours} <span style="font-size:14px; color:#9ca3af;">часов</span></div><div style="font-size:11px; color:#10b981;">В среднем на волонтёра</div></div>
        `;

            // Блок 3: Проекты
            document.getElementById('kpiProjects').innerHTML = `
            <div class="kpi-card"><div class="kpi-title">Активные проекты</div><div class="kpi-value">${kpi.activeProjects}</div><div style="font-size:11px; color:#9ca3af;">Ищут людей прямо сейчас</div></div>
            <div class="kpi-card"><div class="kpi-title">Дефицит людей</div><div class="kpi-value" style="color:#ef4444;">${kpi.underfilledProjects}</div><div style="font-size:11px; color:#9ca3af;">Набрано < 30% мест</div></div>
            <div class="kpi-card"><div class="kpi-title">Скорость набора</div><div class="kpi-value">${kpi.avgTimeToFill} <span style="font-size:14px; color:#9ca3af;">дней</span></div><div style="font-size:11px; color:#9ca3af;">До полного закрытия мест</div></div>
            <div class="kpi-card"><div class="kpi-title">Выгорание</div><div class="kpi-value">${kpi.burnoutRate}%</div><div style="font-size:11px; color:#ef4444;">Ушли после 1 задания</div></div>
        `;

            const geoData = await apiFetch('/api/admin/dashboard/geo-stats');
            if (geoData.success) {
                const total = kpi.totalVolunteers || 1;
                document.getElementById('geoTableBody').innerHTML = geoData.stats.map(city => `
        <tr>
            <td><span style="color: #4f46e5; font-weight: 600;">${city._id || 'Не указан'}</span></td>
            <td>${city.count}</td>
            <td>${city.activeProjects || 0}</td>
            <td>
                <div style="display:flex; align-items:center; gap:10px;">
                    <div style="flex:1; background:#2a2a30; height:6px; border-radius:3px;">
                        <div style="width:${(city.count/total*100)}%; background:#4f46e5; height:100%; border-radius:3px;"></div>
                    </div>
                    <span style="font-size:11px; width:35px;">${((city.count/total)*100).toFixed(1)}%</span>
                </div>
            </td>
        </tr>
    `).join('');
            }
        }

        async function loadRegistrations(period) {
            const res = await apiFetch(`/api/admin/dashboard/registrations-timeline?period=${period}`);
            if (res.success && document.getElementById('regChart')) {
                const days = period === 'week' ? 7 : 30;
                const filledData = [];
                const dataMap = new Map(res.data.map(d => [d._id, d.count]));

                // Генерируем массив дат от сегодня назад
                for(let i = days - 1; i >= 0; i--) {
                    const d = new Date();
                    d.setDate(d.getDate() - i);
                    const dateStr = d.toISOString().split('T')[0];
                    filledData.push({ date: dateStr, count: dataMap.get(dateStr) || 0 });
                }

                const ctx = document.getElementById('regChart').getContext('2d');
                if (regChart) regChart.destroy();

                regChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: filledData.map(d => d.date.slice(5)), // Показываем только месяц-день (MM-DD)
                        datasets: [{
                            label: 'Новые волонтёры',
                            data: filledData.map(d => d.count),
                            borderColor: '#4f46e5',
                            tension: 0.4,
                            fill: true,
                            backgroundColor: 'rgba(79,70,229,0.1)',
                            pointRadius: 4,
                            pointBackgroundColor: '#1a1a1f',
                            borderWidth: 3
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            x: { grid: { color: 'rgba(255, 255, 255, 0.05)' }, ticks: { color: '#9ca3af' } },
                            y: {
                                grid: { color: 'rgba(255, 255, 255, 0.05)' },
                                beginAtZero: true,
                                suggestedMax: 5, // Чтобы график не был плоским при 0 регистрациях
                                ticks: { color: '#9ca3af', stepSize: 1 }
                            }
                        }
                    }
                });
            }
        }

        loadRegistrations('week');
        document.querySelectorAll('.period-btn').forEach(btn => btn.addEventListener('click', () => {
            document.querySelectorAll('.period-btn').forEach(b => b.classList.replace('btn', 'btn-secondary'));
            btn.classList.replace('btn-secondary', 'btn');
            loadRegistrations(btn.dataset.period);
        }));

        async function loadLiveFeed() {
            const feed = await apiFetch('/api/admin/dashboard/live-feed');
            if (feed.success) {
                const container = document.getElementById('liveFeed');
                if (!container) return;
                if (!feed.events || feed.events.length === 0) {
                    container.innerHTML = '<div class="feed-item">Нет событий</div>';
                    return;
                }
                container.innerHTML = feed.events.map(ev => {
                    const userName = ev.user?.name || ev.user?.email || 'Пользователь';
                    const userId = ev.user?._id;
                    const userLink = userId ? `<a href="#" onclick="window.openPublicProfile('${userId}'); return false;" style="color:#4f46e5; font-weight:600;">${escapeHtml(userName)}</a>` : escapeHtml(userName);

                    // Безопасное форматирование даты
                    let eventDate = 'Дата неизвестна';
                    if (ev.createdAt) {
                        try {
                            const date = new Date(ev.createdAt);
                            if (!isNaN(date.getTime())) {
                                eventDate = date.toLocaleString();
                            } else {
                                console.warn('Невалидная дата в объекте:', ev.createdAt);
                            }
                        } catch (e) {
                            console.error('Ошибка парсинга даты:', e);
                        }
                    } else {
                        console.warn('Отсутствует createdAt у события:', ev);
                    }

                    let message = '';
                    let icon = '🔔';
                    switch (ev.eventType) {
                        case 'registration':
                            icon = '🎉';
                            message = `${userLink} зарегистрировался`;
                            break;
                        case 'project_apply':
                            icon = '🤝';
                            message = `${userLink} откликнулся на "${ev.eventData?.projectTitle || 'проект'}"`;
                            break;
                        case 'project_apply_cancel':
                            icon = '🚫';
                            message = `${userLink} отменил отклик`;
                            break;
                        case 'post_created':
                            icon = '📝';
                            message = `${userLink} создал пост`;
                            break;
                        case 'post_deleted':
                            icon = '🗑️';
                            message = `${userLink} удалил пост`;
                            break;
                        case 'comment_created':
                            icon = '💬';
                            message = `${userLink} оставил комментарий`;
                            break;
                        case 'news_created':
                            icon = '📢';
                            message = `${userLink} создал новость "${ev.eventData?.newsTitle || ''}"`;
                            break;
                        case 'news_deleted':
                            icon = '⚠️';
                            message = `${userLink} удалил новость`;
                            break;
                        default:
                            icon = '🔔';
                            message = `${userLink} ${ev.eventType}`;
                    }
                    return `<div class="feed-item">${icon} ${message}<div style="font-size:11px;color:#6b7280;margin-top:4px;">${eventDate}</div></div>`;
                }).join('');
            } else {
                console.error('Failed to load feed', feed.error);
                document.getElementById('liveFeed').innerHTML = '<div class="feed-item">Ошибка загрузки ленты</div>';
            }
        }
        loadLiveFeed();
        if (liveFeedInterval) clearInterval(liveFeedInterval);
        liveFeedInterval = setInterval(loadLiveFeed, 5000);

        const funnel = await apiFetch('/api/admin/analytics/funnel');
        if (funnel.success) {
            const max = Math.max(...funnel.funnel.map(s => s.count));
            document.getElementById('funnelContainer').innerHTML = funnel.funnel.map(step => `
                <div style="margin-bottom: 16px;">
                    <div style="display:flex; justify-content:space-between; margin-bottom:6px;"><span>${step.name}</span><span style="color:#4f46e5;">${step.count}</span></div>
                    <div style="background:#2a2a30; border-radius:8px; overflow:hidden;"><div style="width:${max ? (step.count/max*100) : 0}%; background:#4f46e5; height:8px;"></div></div>
                </div>
            `).join('');
        }
    }

    async function renderSegments() {

        document.getElementById('content').innerHTML = `

            <div class="card"><h3>⚙️ Конструктор правил</h3><div class="two-columns"><div><select id="fieldSelect"><option value="city">Город</option><option value="minEvents">Мин. событий</option><option value="isActive">Активен</option><option value="source">Источник</option><option value="role">Роль</option></select><input id="fieldValue" placeholder="Значение" /><button class="btn" id="addRuleBtn">+ Добавить</button></div><div><div id="ruleList"></div><button class="btn" id="calcSegmentCount">Посчитать</button><span id="segmentCountResult" class="badge" style="margin-left:12px;"></span></div></div></div>
        `;
        let rules = [];
        const renderRules = () => { document.getElementById('ruleList').innerHTML = rules.map((r,i) => `<div>${r.field}=${r.value} <button class="btn-secondary btn-sm" data-idx="${i}">✖</button></div>`).join(''); };
        document.getElementById('addRuleBtn').onclick = () => { rules.push({ field: document.getElementById('fieldSelect').value, value: document.getElementById('fieldValue').value }); renderRules(); };
        document.getElementById('calcSegmentCount').onclick = async () => {
            const criteria = {};
            rules.forEach(r => { if (r.field === 'city') criteria.city = r.value; if (r.field === 'minEvents') criteria.minEvents = parseInt(r.value); if (r.field === 'isActive') criteria.isActive = r.value === 'true'; if (r.field === 'source') criteria.source = r.value; if (r.field === 'role') criteria.role = r.value; });
            const res = await apiFetch('/api/admin/segments/count', { method: 'POST', body: JSON.stringify({ criteria }) });
            if (res.success) document.getElementById('segmentCountResult').innerText = `Найдено: ${res.count}`;
        };
        document.getElementById('createSegmentBtn').onclick = () => showModal('Создать сегмент', `<div class="field"><label>Название</label><input id="segName" /></div><div class="field"><label>Критерии (JSON)</label><textarea id="segCriteria" rows="3"></textarea></div><button class="btn" id="saveSegBtn">Сохранить</button>`);
    }

    function switchTab(tab) {
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

    }

    document.querySelectorAll('.nav-item[data-tab]').forEach(el => {
