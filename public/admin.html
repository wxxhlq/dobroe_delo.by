<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Маркетинговый Хаб | Доброе_дело.by</title>

    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #0f0f12;
            color: #e1e4e8;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }
        .sidebar {
            width: 280px;
            background: #1a1a1f;
            border-right: 1px solid #2a2a30;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            flex-shrink: 0;
        }
        .logo {
            padding: 24px 20px;
            font-size: 20px;
            font-weight: 800;
            border-bottom: 1px solid #2a2a30;
        }
        .logo span { color: #4f46e5; }
        .nav-item {
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: 0.2s;
            color: #9ca3af;
            font-weight: 500;
            font-size: 13px;
        }
        .nav-item:hover, .nav-item.active {
            background: #2a2a30;
            color: #fff;
            border-left: 3px solid #4f46e5;
        }
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .top-bar {
            padding: 16px 24px;
            background: #1a1a1f;
            border-bottom: 1px solid #2a2a30;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }
        .card {
            background: #1a1a1f;
            border: 1px solid #2a2a30;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 24px;
        }
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }
        .kpi-card {
            background: #1a1a1f;

            border-radius: 20px;
            padding: 20px;

        }
        .kpi-card:hover {
            border-color: #4f46e5;

        }
        .kpi-title {

            text-transform: uppercase;

        }
        .kpi-value {
            font-size: 28px;
            font-weight: 800;

        }
        .chart-container {
            height: 300px;
            margin-bottom: 24px;
        }
        .two-columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }
        table {
            width: 100%;
            border-collapse: collapse;

        th, td {
            text-align: left;
            padding: 10px 8px;
            border-bottom: 1px solid #2a2a30;

        th {
            color: #9ca3af;
            font-weight: 500;
        }
        .badge {
            background: #4f46e5;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            display: inline-block;
        }
        .badge-success { background: #10b981; }
        .badge-warning { background: #f59e0b; }
        .badge-danger { background: #ef4444; }
        .badge-info { background: #3b82f6; }
        .btn {
            background: #4f46e5;
            border: none;
            padding: 8px 14px;
            border-radius: 10px;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 500;
            font-size: 12px;
        }
        .btn:hover { background: #6366f1; }
        .btn-secondary {
            background: #2a2a30;
            border: 1px solid #3a3a42;
        }
        .btn-secondary:hover { background: #3a3a42; }
        .live-feed {

            overflow-y: auto;
        }
        .feed-item {
            padding: 10px 12px;
            border-left: 3px solid #4f46e5;
            background: rgba(79,70,229,0.05);

            border-radius: 8px;

            transition: 0.2s;
            font-size: 12px;
        }
        .feed-item:hover { background: rgba(79,70,229,0.1); }
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

            background: #1a1a1f;
            border-radius: 20px;
            width: 90%;
            max-width: 550px;
            max-height: 90vh;
            overflow: auto;
            padding: 24px;

            background: #0f0f12;

            padding: 8px 12px;
            border-radius: 8px;
            color: white;
            font-size: 13px;

        .field { margin-bottom: 16px; }
        .field label { display: block; margin-bottom: 6px; font-size: 12px; color: #9ca3af; }
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .two-columns { grid-template-columns: 1fr; }

        .chart-container {
            position: relative; /* КРИТИЧЕСКИ ВАЖНО для Chart.js */

            height: 300px;
            margin-bottom: 24px;
        }

        /* --- НОВЫЕ СТИЛИ ДЛЯ ПОЛЬЗОВАТЕЛЕЙ --- */
        .status-dot {
            display: inline-block;

            height: 8px;
            border-radius: 50%;
            margin-right: 6px;

        .status-offline { background: #4b5563; }

            padding: 2px 6px;
            border-radius: 4px;
            background: rgba(79, 70, 229, 0.1);
            color: #818cf8;
            border: 1px solid rgba(79, 70, 229, 0.2);
            display: inline-block;
            margin: 2px;
        }

        /* Выпадающее меню (Quick Actions) */
        .action-dropdown {
            position: relative;
            display: inline-block;
        }
        .action-dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            top: 100%;
            background-color: #1a1a1f;
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.5);

            border-radius: 8px;
            overflow: hidden;

            display: block;

            width: 100%;

            border: none;
            color: #e1e4e8;
            font-size: 12px;
            cursor: pointer;

            backdrop-filter: blur(5px);
            z-index: 1000;
            align-items: center;
            justify-content: center;

        .modal-content {

            border-radius: 16px;

            width: 100%;

            margin-bottom: 16px;

        .modal-body input, .modal-body select {

            padding: 10px;
            background: #2a2a30;
            border: 1px solid #3f3f46;
            border-radius: 8px;
            color: #fff;
            margin-top: 8px;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 24px;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .project-dashboard-grid {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 20px;
        }
        .stat-card {
            background: #1a1a1f;
            border: 1px solid #2a2a30;
            border-radius: 12px;
            padding: 20px;

        /* Сетка для динамики */
        .activity-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));

        .activity-item {
            background: #1a1a1f;

            border-radius: 12px;
            padding: 16px;

            flex-direction: column;
            justify-content: space-between;

            transform: translateY(-2px);

        .status-badge {

            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-approved { background: rgba(16, 185, 129, 0.1); color: #10b981; }
        .status-pending { background: rgba(245, 158, 11, 0.1); color: #f59e0b; }

        .date-divider {
            grid-column: 1 / -1;

            align-items: center;
            gap: 15px;
            margin: 20px 0 10px;
            color: #64748b;
            font-size: 13px;
            font-weight: 500;
        }

        .date-divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #2a2a30;
        }

    </style>
</head>
<body>
<div class="sidebar">

</div>
<div class="main">
    <div class="top-bar">
        <h2 id="pageTitle">Пульс системы</h2>
        <div>⚡ Маркетинговый хаб</div>
    </div>
    <div class="content" id="content"></div>
</div>

<script>
    const API_BASE = '';
    let currentTab = 'dashboard';
    let liveFeedInterval = null;
    let regChart = null;
    const API_URL = window.location.origin;

    const storedUserStr = localStorage.getItem('user');
    let currentUserObj = null;
    if (storedUserStr) {
        try {
            currentUserObj = JSON.parse(storedUserStr);
        } catch (e) {}
    }
    if (!currentUserObj || (currentUserObj.role !== 'ADMIN' && currentUserObj.role !== 'MODERATOR')) {
        window.location.href = '/';
    }

    document.addEventListener('DOMContentLoaded', function() {
        if (currentUserObj && currentUserObj.role === 'MODERATOR') {
            const adminOnlyTabs = ['participationMetrics', 'activityMetrics', 'analytics', 'segments', 'communications', 'monitoring'];
            document.querySelectorAll('.nav-item').forEach(el => {
                const tab = el.dataset.tab;
                if (adminOnlyTabs.includes(tab)) {
                    el.style.display = 'none';
                }
            });
        }
    });

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function (m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }




    async function apiFetch(url, options = {}) {
        // 2. Формируем полный URL.
        // Если url уже начинается с http, оставляем как есть, иначе добавляем API_URL
        const targetUrl = url.startsWith('http') ? url : `${API_URL}${url}`;

        const token = localStorage.getItem('token') || localStorage.getItem('authToken');

        const headers = {
            'Content-Type': 'application/json',
            // Добавляем заголовок только если токен существует
            ...(token && { 'Authorization': `Bearer ${token}` }),
            ...options.headers
        };

        try {
            const res = await fetch(targetUrl, { ...options, headers });

            if (res.status === 401) {
                // Убедись, что функция logout() определена в коде
                if (typeof logout === 'function') {
                    logout();
                } else {
                    localStorage.clear();
                    window.location.href = '/login.html';
                }
                throw new Error('Сессия истекла');
            }

            // Проверка на пустой ответ (чтобы не упасть на res.json())
            if (res.status === 204 || res.headers.get('content-length') === '0') {
                return { success: true };
            }

            return await res.json();
        } catch (err) {
            console.error(`Ошибка при запросе к ${targetUrl}:`, err);
            return { success: false, error: err.message };
        }
    }

    function logout() {
        localStorage.clear();
        window.location.href = '/';
    }

    function goToMain() {
        window.location.href = '/';
    }

    function showModal(title, html) {
        const modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML = `
            <div class="modal-content">
                <h3 style="margin-bottom: 20px;">${title}</h3>
                ${html}
                <div style="margin-top: 20px; text-align: right;">
                    <button class="btn-secondary" onclick="this.closest('.modal').remove()">Закрыть</button>
                </div>
            </div>
        `;
        document.body.appendChild(modal);
    }

    window.openPublicProfile = async function (userId) {
        try {
            const data = await apiFetch(`/api/admin/user/${userId}`);
            if (data.success && data.user) {
                const u = data.user;
                showModal('Профиль пользователя', `
                    <div style="text-align: center;">
                        <div style="font-size: 64px; margin-bottom: 16px;">👤</div>
                        <h3>${escapeHtml(u.name || u.email)}</h3>
                        <p style="color: #9ca3af;">${u.role === 'VOLUNTEER' ? 'Волонтёр' : u.role === 'ORGANIZER' ? 'Организатор' : u.role === 'MODERATOR' ? 'Модератор' : 'Администратор'}</p>
                        <div style="text-align: left; margin-top: 20px;">
                            <p><strong>📧 Email:</strong> ${escapeHtml(u.email || '—')}</p>
                            <p><strong>📍 Город:</strong> ${escapeHtml(u.city || '—')}</p>
                            <p><strong>📱 Телефон:</strong> ${escapeHtml(u.phone || '—')}</p>
                            <p><strong>⭐ Опыт (XP):</strong> ${u.points || 0}</p>
                            <p><strong>📅 Регистрация:</strong> ${new Date(u.createdAt).toLocaleString()}</p>
                        </div>
                    </div>
                `);
            } else alert('Не удалось загрузить профиль');
        } catch (err) {
            alert('Ошибка загрузки профиля');
        }
    };

    // ===================== ДАШБОРД =====================
    async function renderDashboard() {
        document.getElementById('pageTitle').innerText = 'Пульс системы';
        document.getElementById('content').innerHTML = `
        <div style="margin-bottom: 30px;">
            <h3 style="margin-bottom: 16px; color: #fff; display: flex; align-items: center; gap: 8px;">👥 Аудитория платформы</h3>
            <div class="kpi-grid" id="kpiAudience">Загрузка...</div>
        </div>

        <div style="margin-bottom: 30px;">
            <h3 style="margin-bottom: 16px; color: #fff; display: flex; align-items: center; gap: 8px;">⚡ Эффективность и Вовлеченность</h3>
            <div class="kpi-grid" id="kpiEngagement">Загрузка...</div>
        </div>

        <div style="margin-bottom: 30px;">
            <h3 style="margin-bottom: 16px; color: #fff; display: flex; align-items: center; gap: 8px;">🗂 Здоровье проектов</h3>
            <div class="kpi-grid" id="kpiProjects">Загрузка...</div>
        </div>


        <div style="margin-bottom: 30px;">
            <h3 style="margin-bottom: 16px; color: #fff; display: flex; align-items: center; gap: 8px;">📍 География охвата (Топ городов)</h3>
            <div class="card" style="padding: 0; overflow: hidden;">
                <table id="geoTable" style="margin-bottom: 0;">
                    <thead>
                        <tr>
                            <th>Город / Регион</th>
                            <th>Волонтёры</th>
                            <th>Активные проекты</th>
                            <th>Доля от общей базы</th>
                        </tr>
                    </thead>
                    <tbody id="geoTableBody">
                        <tr><td colspan="4" style="text-align:center; padding:20px;">Загрузка данных по городам...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="card" style="position: relative;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <h3>📈 Динамика регистраций</h3>
                <div style="display: flex; gap: 8px;">
                    <button class="btn btn-secondary period-btn" data-period="week">Неделя</button>
                    <button class="btn btn-secondary period-btn" data-period="month">Месяц</button>
                </div>
            </div>
            <div class="chart-container" style="position: relative; height: 300px; width: 100%;">
                <canvas id="regChart"></canvas>
            </div>
        </div>

        <div class="two-columns">
            <div class="card">
                <h3>🔥 Живая активность</h3>
                <div id="liveFeed" class="live-feed">Ожидание данных...</div>
            </div>
            <div class="card">
                <h3>📊 Воронка пользователя (Конверсия)</h3>
                <div id="funnelContainer" style="margin-top: 20px;"></div>
            </div>
        </div>
    `;

        const kpi = await apiFetch('/api/admin/dashboard/kpi');
        if (kpi.success) {
            // Блок 1: Аудитория
            document.getElementById('kpiAudience').innerHTML = `
            <div class="kpi-card"><div class="kpi-title">Всего пользователей</div><div class="kpi-value">${kpi.totalUsers}</div><div style="font-size:11px; color:#9ca3af;">База аккаунтов</div></div>
            <div class="kpi-card" style="border-bottom: 3px solid #4f46e5;"><div class="kpi-title">Волонтёры</div><div class="kpi-value">${kpi.totalVolunteers}</div><div style="font-size:11px; color:#10b981;">+${kpi.new7d} за неделю</div></div>
            <div class="kpi-card" style="border-bottom: 3px solid #f59e0b;"><div class="kpi-title">Организаторы</div><div class="kpi-value">${kpi.totalOrganizers}</div><div style="font-size:11px; color:#9ca3af;">Создатели проектов</div></div>
            <div class="kpi-card"><div class="kpi-title">Уникальные (DAU)</div><div class="kpi-value">${kpi.dau}</div><div style="font-size:11px; color:#10b981;">Заходили сегодня</div></div>
        `;

            // Блок 2: Эффективность
            document.getElementById('kpiEngagement').innerHTML = `
            <div class="kpi-card"><div class="kpi-title">Retention (Удержание)</div><div class="kpi-value">${kpi.retentionRate}%</div><div style="font-size:11px; color:#9ca3af;">Вернулись через 7 дней</div></div>
            <div class="kpi-card"><div class="kpi-title">Конверсия в отклик</div><div class="kpi-value">${kpi.ctr}%</div><div style="font-size:11px; color:#9ca3af;">Просмотр → Пойду</div></div>
            <div class="kpi-card"><div class="kpi-title">Явка (Show-up rate)</div><div class="kpi-value">${kpi.showUpRate}%</div><div style="font-size:11px; color:#f59e0b;">Дошли до проекта</div></div>
            <div class="kpi-card"><div class="kpi-title">Social LTV</div><div class="kpi-value">${kpi.avgHours} <span style="font-size:14px; color:#9ca3af;">часов</span></div><div style="font-size:11px; color:#10b981;">В среднем на волонтёра</div></div>
        `;

            // Блок 3: Проекты

    function getRelativeTimeString(date) {
        if (!date) return 'никогда';
        const now = new Date();
        const then = new Date(date);
        const diffSeconds = Math.floor((now - then) / 1000);
        const diffMinutes = Math.floor(diffSeconds / 60);
        const diffHours = Math.floor(diffMinutes / 60);

        // 5 минут — считаем "В сети" (Online)
        if (diffSeconds < 300) {
            return '<span style="color:#10b981; font-weight:600;">online</span>';
        }

        if (diffMinutes < 60) return `был${getGenderSuffix(date)} ${diffMinutes} мин. назад`;

        if (diffHours < 24) {
            if (now.getDate() === then.getDate()) {
                return `был${getGenderSuffix(date)} сегодня в ${then.getHours()}:${then.getMinutes().toString().padStart(2, '0')}`;
            }
        }

        if (diffHours < 48) {
            const yesterday = new Date();
            yesterday.setDate(now.getDate() - 1);
            if (yesterday.getDate() === then.getDate()) {
                return `был${getGenderSuffix(date)} вчера в ${then.getHours()}:${then.getMinutes().toString().padStart(2, '0')}`;
            }
        }

        return `был${getGenderSuffix(date)} ${then.toLocaleDateString()}`;
    }

    // Мини-функция для окончаний "был/была"
    function getGenderSuffix(date) {
        // В идеале брать из u.gender, но пока оставим универсально или привяжем к "а" в конце имени
        return 'а';
    }

    function applyUserFilters(filterType) {

        const filtered = currentUsersData.filter(u => {

            const diffDaysReg = (now - regDate) / (1000 * 60 * 60 * 24);
            const diffDaysActive = (now - lastActive) / (1000 * 60 * 60 * 24);
            const points = u.points || 0;

            switch (filterType) {
                case 'heroes':
                    // Совпадает с иконкой ⭐ (XP >= 100)
                    return points >= 100;
                case 'newbies':
                    // Совпадает с иконкой 🌱 (регистрация до 7 дней)
                    return diffDaysReg <= 7;
                case 'sleeping':
                    // Совпадает с иконкой 💤 (не заходили > 30 дней)
                    return diffDaysActive > 30;
                case 'orgs':
                    return u.role === 'ORGANIZER' || u.role === 'ADMIN';
                default:
                    return true;
            }
        });

        // Визуальное переключение кнопок

    /**
     * Умное форматирование времени а-ля ВК
     * @param {Date} lastActive - дата последнего входа
     * @param {string} name - имя для определения пола
     */
    function formatLastSeenVk(lastActive, name = '') {
        const now = new Date();
        const diffMs = now - lastActive;
        const diffMins = Math.floor(diffMs / 60000);
        const diffHours = Math.floor(diffMs / 3600000);

        // Простая логика пола: если имя заканчивается на "а" или "я" — она
        const isFemale = /[ая]$/i.test(name.trim());
        const action = isFemale ? '' : '';

        // 1. Статус Online (до 7 минут, чтобы сгладить задержки пинга)
        if (diffMins < 7 && diffMins >= 0) {
            return '<span style="color:#10b981; font-weight:600;">online</span>';
        }

        // 2. Минуты
        if (diffMins < 60) {
            return `${action} ${diffMins} мин. назад`;
        }

        // 3. Сегодня в...
        if (now.toDateString() === lastActive.toDateString()) {
            const time = lastActive.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
            return `${action} сегодня в ${time}`;
        }

        // 4. Вчера в...
        const yesterday = new Date();
        yesterday.setDate(now.getDate() - 1);
        if (yesterday.toDateString() === lastActive.toDateString()) {
            const time = lastActive.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
            return `${action} вчера в ${time}`;
        }

        // 5. Давняя дата
        return `${action} ${lastActive.toLocaleDateString()}`;
    }

    function renderCategoryChart(apiCategories) {
        const canvas = document.getElementById('projectDonutChart');
        if (!canvas) return;

        // Сопоставляем данные из БД с нашим массивом CATEGORIES для имен и цветов
        const chartLabels = [];
        const chartData = [];
        const chartColors = [];
        const legendHtml = [];

        CATEGORIES.forEach(cat => {
            // Ищем в ответе от сервера (data.categories) объект с таким же _id
            const found = apiCategories.find(c => c._id === cat.id);
            const count = found ? found.count : 0;

            chartLabels.push(cat.name);
            chartData.push(count);
            chartColors.push(cat.color);

            legendHtml.push(`
            <div style="display: flex; justify-content: space-between; align-items: center; font-size: 13px;">
                <div style="display: flex; align-items: center; gap: 8px;">
                    <div style="width: 8px; height: 8px; border-radius: 50%; background: ${cat.color};"></div>
                    <span style="color: #94a3b8;">${cat.name}</span>
                </div>
                <span style="color: #fff; font-weight: 600;">${count}</span>
            </div>
        `);
        });

        document.getElementById('projectChartLegend').innerHTML = legendHtml.join('');

        // Инициализация Chart.js
        new Chart(canvas, {
            type: 'doughnut',
            data: {
                labels: chartLabels,
                datasets: [{
                    data: chartData,
                    backgroundColor: chartColors,
                    borderWidth: 0,
                    hoverOffset: 10
                }]
            },
            options: {
                cutout: '80%',
                responsive: true,
                maintainAspectRatio: false,
                plugins: {legend: {display: false}}
            }
        });
    }

        async function loadData() {
            const btn = document.getElementById('manualRefresh');
            const container = document.getElementById('metrics-container');
            const cards = container.querySelectorAll('.m-card');

            btn.disabled = true;
            btn.innerText = 'Загрузка...';
            cards.forEach(c => c.classList.add('is-loading'));

            try {
                const token = localStorage.getItem('token') || localStorage.getItem('authToken');
                if (!token) throw new Error('Требуется авторизация');

                const res = await fetch(`${API_URL}/api/admin/activity-metrics`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!res.ok) throw new Error(`Status: ${res.status}`);
                const data = await res.json();

                // Заполнение данных
                cards.forEach(c => c.classList.remove('is-loading'));

                document.getElementById('h-usage').innerText = data.dau_wau_mau || "0/0/0";
                document.getElementById('h-sticky').innerText = (data.stickyFactor || 0) + '%';
                document.getElementById('h-views').innerText = (data.views || 0).toLocaleString();
                document.getElementById('h-c1').innerText = (data.convClick || 0) + '%';
                document.getElementById('h-c2').innerText = (data.convApply || 0) + '%';
                document.getElementById('h-depth').innerText = `${data.avgDepth || 0} стр. за визит`;

                // Обработка времени
                const sec = data.avgDuration || 0;
                document.getElementById('h-duration').innerText = `${Math.floor(sec/60)}:${(sec%60).toString().padStart(2,'0')}`;

                // Логика цвета для Bounce Rate
                const bEl = document.getElementById('h-bounce');
                const bVal = parseFloat(data.bounceRate || 0);
                bEl.innerText = bVal + '%';
                bEl.className = `m-value ${bVal > 40 ? 'accent-red' : 'accent-green'}`;

                document.getElementById('hub-status').innerText = `Обновлено в ${new Date().toLocaleTimeString()}`;

            } catch (e) {
                console.error("Hub Error:", e);
                document.getElementById('hub-status').innerHTML = `<span class="accent-red">Ошибка: ${e.message}</span>`;
                cards.forEach(c => c.classList.remove('is-loading'));
            } finally {
                btn.disabled = false;
                btn.innerText = 'Обновить метрики';
            }
        }

        document.getElementById('manualRefresh').onclick = loadData;
        loadData();
    }

            role: { label: 'Роль', type: 'select', options: ['VOLUNTEER', 'ORGANIZER', 'MODERATOR', 'ADMIN'], operators: ['eq', 'neq'] },
            minEvents: { label: 'Минимум событий', type: 'number', operators: ['gte', 'lte', 'eq', 'gt', 'lt'] },
            isActive: { label: 'Активен за 30 дней', type: 'boolean', operators: ['eq'] },
            source: { label: 'Источник трафика', type: 'select', options: availableSources, operators: ['eq', 'neq'] },
            completedProjects: { label: 'Завершённые проекты', type: 'number', operators: ['gte', 'lte', 'eq', 'gt', 'lt'] }
        };

        const operatorLabels = {
            eq: '=',
            neq: '≠',
            gt: '>',
            lt: '<',
            gte: '≥',
            lte: '≤'
        };

        // --- HTML ---
        document.getElementById('content').innerHTML = `
        <div class="two-columns" style="align-items: start;">
            <div class="card">
                <h3>⚙️ Конструктор сегмента</h3>
                <div>
                    <div class="field"><label>Название сегмента</label><input type="text" id="segmentName" placeholder="Название"></div>
                    <div class="field"><label>Тип сегмента</label><select id="segmentType"><option value="dynamic">Динамический</option><option value="static">Статический</option></select></div>
                    <div class="field"><label>Правила (AND)</label><div id="rulesList"></div><button type="button" class="btn btn-secondary" id="addRuleBtn" style="width:100%;">+ Добавить правило</button></div>
                    <div style="display:flex; gap:10px; margin-top:20px;"><button class="btn" id="previewSegmentBtn">Посчитать</button><button class="btn" id="saveSegmentBtn">Сохранить</button><button class="btn btn-secondary" id="resetSegmentBtn">Очистить</button></div>
                    <div id="previewResult" style="margin-top:12px; text-align:center;"></div>
                </div>
                <div id="editHint" style="display:none; background:#2a2a30; padding:10px; border-radius:8px; margin-top:15px;">✏️ Редактирование: <span id="editSegmentId"></span></div>
            </div>
            <div class="card"><h3>📋 Сохранённые сегменты</h3><div style="overflow-x:auto;"><table style="width:100%;"><thead> <th>Название</th><th>Критерии</th><th>Пользователей</th><th>Тип</th><th>Действия</th> </thead><tbody id="segmentsTableBody"> <td colspan="5">Загрузка...  </tbody>  </div></div>
        </div>
    `;

        let currentRules = [];   // { field, operator, value }
        let editingId = null;

        function renderRulesList() {
            const container = document.getElementById('rulesList');
            if (!container) return;
            container.innerHTML = '';

            if (currentRules.length === 0) {
                container.innerHTML = '<div style="color:#6b7280; padding:10px; text-align:center;">Нет правил. Добавьте первое.</div>';
                return;
            }

            currentRules.forEach((rule, idx) => {
                const cfg = fieldConfig[rule.field];
                if (!cfg) return;
                const row = document.createElement('div');
                row.style.display = 'flex'; row.style.gap = '8px'; row.style.marginBottom = '8px'; row.style.alignItems = 'center'; row.style.background = '#0f0f12'; row.style.padding = '8px'; row.style.borderRadius = '8px';

                // Поле
                const fieldSelect = document.createElement('select');
                fieldSelect.style.flex = '1';
                fieldSelect.innerHTML = Object.entries(fieldConfig).map(([k, v]) => `<option value="${k}" ${rule.field === k ? 'selected' : ''}>${v.label}</option>`).join('');
                fieldSelect.dataset.idx = idx;
                fieldSelect.onchange = (e) => {
                    const newField = e.target.value;
                    currentRules[idx].field = newField;
                    currentRules[idx].operator = fieldConfig[newField].operators[0];
                    currentRules[idx].value = '';
                    renderRulesList();
                    updatePreviewCountDebounced();
                };

                // Оператор
                const opSelect = document.createElement('select');
                opSelect.style.flex = '0.8';
                opSelect.innerHTML = cfg.operators.map(op => `<option value="${op}" ${rule.operator === op ? 'selected' : ''}>${operatorLabels[op]}</option>`).join('');
                opSelect.dataset.idx = idx;
                opSelect.onchange = (e) => {
                    currentRules[idx].operator = e.target.value;
                    updatePreviewCountDebounced();
                };

                // Значение
                let valueInput;
                if (cfg.type === 'select') {
                    valueInput = document.createElement('select');
                    valueInput.style.flex = '2';
                    valueInput.innerHTML = '<option value="">Выберите...</option>' + cfg.options.map(opt => `<option value="${opt}" ${rule.value === opt ? 'selected' : ''}>${opt}</option>`).join('');
                    valueInput.onchange = (e) => { currentRules[idx].value = e.target.value; updatePreviewCountDebounced(); };
                } else if (cfg.type === 'boolean') {
                    valueInput = document.createElement('select');
                    valueInput.style.flex = '2';
                    valueInput.innerHTML = `<option value="">Не выбрано</option><option value="true" ${rule.value === 'true' ? 'selected' : ''}>Да</option><option value="false" ${rule.value === 'false' ? 'selected' : ''}>Нет</option>`;
                    valueInput.onchange = (e) => { currentRules[idx].value = e.target.value; updatePreviewCountDebounced(); };
                } else {
                    valueInput = document.createElement('input');
                    valueInput.type = cfg.type;
                    valueInput.placeholder = 'Значение';
                    valueInput.style.flex = '2';
                    valueInput.value = rule.value || '';
                    valueInput.oninput = (e) => { currentRules[idx].value = e.target.value; updatePreviewCountDebounced(); };
                }

                const delBtn = document.createElement('button');
                delBtn.className = 'btn-secondary';
                delBtn.textContent = '✖';
                delBtn.style.padding = '4px 8px';
                delBtn.onclick = () => {
                    currentRules.splice(idx, 1);
                    renderRulesList();
                    updatePreviewCountDebounced();
                };

                row.appendChild(fieldSelect);
                row.appendChild(opSelect);
                row.appendChild(valueInput);
                row.appendChild(delBtn);
                container.appendChild(row);
            });
        }

        // Преобразование правил в критерии для API
        function getCriteria() {
            const criteria = {};
            for (const rule of currentRules) {
                let val = rule.value;
                if (!val || val === '') continue;

                const op = rule.operator;
                // Числовые поля
                if (rule.field === 'minEvents' || rule.field === 'completedProjects') {
                    const num = Number(val);
                    if (isNaN(num)) continue;
                    if (op === 'eq') criteria[rule.field] = num;
                    else if (op === 'neq') criteria[rule.field] = { $ne: num };
                    else if (op === 'gt') criteria[rule.field] = { $gt: num };
                    else if (op === 'lt') criteria[rule.field] = { $lt: num };
                    else if (op === 'gte') criteria[rule.field] = { $gte: num };
                    else if (op === 'lte') criteria[rule.field] = { $lte: num };
                    continue;
                }

                // Булевы
                if (rule.field === 'isActive') {
                    const boolVal = val === 'true';
                    criteria[rule.field] = boolVal;
                    continue;
                }

                // Строковые (city, role, source) – поддерживаем только равенство/неравенство
                if (op === 'eq') criteria[rule.field] = val;
                else if (op === 'neq') criteria[rule.field] = { $ne: val };
            }
            return criteria;
        }

        let previewTimeout;
        function updatePreviewCountDebounced() { clearTimeout(previewTimeout); previewTimeout = setTimeout(updatePreviewCount, 500); }
        async function updatePreviewCount() {
            const resultSpan = document.getElementById('previewResult');
            const criteria = getCriteria();
            if (Object.keys(criteria).length === 0) {
                resultSpan.innerHTML = '<span class="badge badge-warning">⚠️ Заполните хотя бы одно правило</span>';
                return;
            }
            resultSpan.innerHTML = '<span class="badge">⏳ Подсчёт...</span>';
            try {
                const res = await apiFetch('/api/admin/segments/count', { method: 'POST', body: JSON.stringify({ criteria }) });
                if (res.success) resultSpan.innerHTML = `<span class="badge badge-success">✅ Найдено: ${res.count}</span>`;
                else resultSpan.innerHTML = `<span class="badge badge-danger">❌ Ошибка: ${res.error}</span>`;
            } catch (err) { resultSpan.innerHTML = '<span class="badge badge-danger">❌ Ошибка связи</span>'; }
        }

        async function loadSegmentsList() {
            const tbody = document.getElementById('segmentsTableBody');
            try {
                const res = await apiFetch('/api/admin/segments');
                if (!res.success) throw new Error(res.error);
                if (!res.segments.length) { tbody.innerHTML = ' <td colspan="5">Нет сегментов  '; return; }
                tbody.innerHTML = res.segments.map(seg => `
            <tr>
                <td><strong>${escapeHtml(seg.name)}</strong></td>
                <td style="max-width:200px; overflow:hidden; text-overflow:ellipsis;" title="${escapeHtml(JSON.stringify(seg.criteria))}">${JSON.stringify(seg.criteria).substring(0, 50)}${JSON.stringify(seg.criteria).length > 50 ? '…' : ''}</td>
                <td>${seg.count || '—'}</td>
                <td><span class="badge ${seg.isDynamic ? 'badge-success' : 'badge-warning'}">${seg.isDynamic ? 'Динамический' : 'Статический'}</span></td>
                <td>
                    <button class="btn-secondary edit-seg" data-id="${seg._id}" data-name="${escapeHtml(seg.name)}" data-criteria='${JSON.stringify(seg.criteria)}' data-dynamic="${seg.isDynamic}">✏️</button>
                    <button class="btn-secondary del-seg" data-id="${seg._id}">🗑️</button>
                    <button class="btn-secondary exp-seg" data-id="${seg._id}" data-name="${escapeHtml(seg.name)}">📎</button>
                </td>
             </tr>
        `).join('');

                // Редактирование
                document.querySelectorAll('.edit-seg').forEach(btn => {
                    btn.onclick = () => {
                        editingId = btn.dataset.id;
                        document.getElementById('segmentName').value = btn.dataset.name;
                        document.getElementById('segmentType').value = btn.dataset.dynamic === 'true' ? 'dynamic' : 'static';
                        const criteria = JSON.parse(btn.dataset.criteria);
                        currentRules = [];
                        for (const [field, value] of Object.entries(criteria)) {
                            if (value === undefined || value === null) continue;
                            // Определяем оператор по типу значения
                            let op = 'eq';
                            if (typeof value === 'object') {
                                if (value.$ne) { op = 'neq'; value = value.$ne; }
                                else if (value.$gt) { op = 'gt'; value = value.$gt; }
                                else if (value.$lt) { op = 'lt'; value = value.$lt; }
                                else if (value.$gte) { op = 'gte'; value = value.$gte; }
                                else if (value.$lte) { op = 'lte'; value = value.$lte; }
                                else continue;
                            }
                            let strVal = String(value);
                            if (field === 'isActive') strVal = value === true ? 'true' : 'false';
                            currentRules.push({ field, operator: op, value: strVal });
                        }
                        renderRulesList();
                        updatePreviewCountDebounced();
                        document.getElementById('editHint').style.display = 'block';
                        document.getElementById('editSegmentId').innerText = btn.dataset.name;
                    };
                });

                // Удаление
                document.querySelectorAll('.del-seg').forEach(btn => {
                    btn.onclick = async () => {
                        if (!confirm('Удалить сегмент?')) return;
                        const delRes = await apiFetch(`/api/admin/segments/${btn.dataset.id}`, { method: 'DELETE' });
                        if (delRes.success) { if (editingId === btn.dataset.id) resetForm(); loadSegmentsList(); }
                        else alert('Ошибка удаления');
                    };
                });

                // ЭКСПОРТ – заменяем на вызов модального окна
                document.querySelectorAll('.exp-seg').forEach(btn => {
                    btn.onclick = () => showExportModal(btn.dataset.id, btn.dataset.name);
                });

            } catch (err) {
                tbody.innerHTML = ` <td colspan="5" style="color:#ef4444;">Ошибка: ${err.message}  </tr>`;
            }
        }

        async function saveSegment() {
            const name = document.getElementById('segmentName').value.trim();
            if (!name) { alert('Введите название'); return; }
            const criteria = getCriteria();
            if (Object.keys(criteria).length === 0) { alert('Добавьте хотя бы одно заполненное правило'); return; }
            const isDynamic = document.getElementById('segmentType').value === 'dynamic';
            const url = editingId ? `/api/admin/segments/${editingId}` : '/api/admin/segments';
            const method = editingId ? 'PUT' : 'POST';
            const res = await apiFetch(url, { method, body: JSON.stringify({ name, criteria, isDynamic }) });
            if (res.success) {
                alert(editingId ? 'Сегмент обновлён' : 'Сегмент создан');
                resetForm();
                loadSegmentsList();
            } else alert(`Ошибка: ${res.error}`);
        }

        function resetForm() {
            editingId = null;
            document.getElementById('segmentName').value = '';
            document.getElementById('segmentType').value = 'dynamic';
            currentRules = [];
            renderRulesList();
            document.getElementById('editHint').style.display = 'none';
            document.getElementById('previewResult').innerHTML = '';
        }

        function addRule() {
            // Проверяем, нет ли незаполненного правила
            const hasEmpty = currentRules.some(r => !r.value || r.value === '');
            if (hasEmpty) {
                alert('Сначала заполните или удалите текущее правило');
                return;
            }
            currentRules.push({ field: 'city', operator: 'eq', value: '' });
            renderRulesList();
            updatePreviewCountDebounced();
        }

        document.getElementById('addRuleBtn').onclick = addRule;
        document.getElementById('saveSegmentBtn').onclick = saveSegment;
        document.getElementById('resetSegmentBtn').onclick = resetForm;
        document.getElementById('previewSegmentBtn').onclick = updatePreviewCount;

        resetForm();
        await loadSegmentsList();
    }

            const sendTimeRadios = modalContainer.querySelectorAll('input[name="sendTime"]');

            const updatePreview = () => {
                const htmlContent = campBody.value;
                previewFrame.innerHTML = htmlContent;
                currentCampaignData = {
                    name: campName.value,
                    subject: campSubject.value,
                    html: campBody.value
                };
            };
            campBody.addEventListener('input', updatePreview);
            campSubject.addEventListener('input', updatePreview);
            campName.addEventListener('input', updatePreview);

                radio.onchange = (e) => {
                    scheduleTime.style.display = e.target.value === 'schedule' ? 'block' : 'none';
                };
            });

            const saveBtn = modalContainer.querySelector('#saveCampaignBtn');
            saveBtn.onclick = async () => {
                const name = campName.value.trim();
                const subject = campSubject.value.trim();
                const body = campBody.value.trim();
                const segmentId = modalContainer.querySelector('#campSegment').value || null;
                const sendTime = modalContainer.querySelector('input[name="sendTime"]:checked').value;
                const scheduleDate = scheduleTime.value;

                if (!name || !subject || !body) {
                    alert('Заполните все поля');
                    return;
                }

                const payload = {
                    name,
                    targetSegmentId: segmentId,
                    content: { subject, bodyHtml: body },
                    sendNow: sendTime === 'now'
                };

                if (sendTime === 'schedule' && scheduleDate) {
                    payload.schedule = { startDate: scheduleDate };
                }

                const res = await apiFetch('/api/admin/communications/campaigns', {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });

                if (res.success) {
                    overlay.remove();
                    loadCampaigns();
                    alert('Рассылка создана!');

                    alert('Ошибка: ' + res.error);

            };

    window.verifyOrganizer = async function(userId, action) {
        let reason = '';
        if (action === 'reject') {
            reason = prompt('Укажите причину отклонения заявки:');
            if (reason === null) return;
            if (!reason.trim()) {
                alert('Причина отклонения обязательна!');
                return;
            }
        }
        const res = await apiFetch(`/api/moderator/verify/${userId}`, {
            method: 'POST',
            body: JSON.stringify({ action, reason })
        });
        if (res.success) {
            alert(action === 'approve' ? 'Организатор успешно верифицирован!' : 'Заявка отклонена');
            renderModeration();
        } else {
            alert('Ошибка: ' + res.error);
        }
    };

    window.moderateProject = async function(projectId, action) {
        let url = `/api/moderator/task/${projectId}/approve`;
        let body = {};
        if (action === 'reject') {
            const reason = prompt('Укажите причину отклонения проекта:');
            if (reason === null) return;
            if (!reason.trim()) {
                alert('Причина обязательна!');
                return;
            }
            url = `/api/moderator/task/${projectId}/reject`;
            body = { reason };
        }
        const res = await apiFetch(url, {
            method: 'POST',
            body: JSON.stringify(body)
        });
        if (res.success) {
            alert(action === 'approve' ? 'Проект одобрен и опубликован!' : 'Проект отклонен');
            renderModeration();
        } else {
            alert('Ошибка: ' + res.error);
        }
    };

    // === 1. ИНТЕРАКТИВНЫЕ КАРТОЧКИ С УЛУЧШЕННОЙ ДИНАМИКОЙ ===
    function renderProjectMetricsCards(projects) {
        const container = document.getElementById('project-metrics-container');
        if (!container) return;

        const total = projects.length;
        const active = projects.filter(p => p.status === 'active' || p.status === 'in_progress').length;
        const pending = projects.filter(p => p.status === 'pending').length;

        // Расчет недобора и эффективности
        let shortage = 0;
        let totalNeeded = 0;
        let totalApplied = 0;

        projects.forEach(p => {
            const needed = parseInt(p.volunteersNeeded) || 0;
            const applied = parseInt(p.volunteersApplied) || 0;
            totalNeeded += needed;
            totalApplied += applied;
            if (needed > applied) shortage += (needed - applied);
        });

        const efficiency = totalNeeded > 0 ? Math.round((totalApplied / totalNeeded) * 100) : 0;

        // Логика визуального предупреждения
        const isCritical = shortage > 5; // Например, если не хватает более 5 человек
        const accentColor = isCritical ? '#ef4444' : (shortage > 0 ? '#fbbf24' : '#10b981');
        const accentBg = isCritical ? 'rgba(239, 68, 68, 0.1)' : 'rgba(16, 185, 129, 0.05)';

        container.innerHTML = `
        <div class="stat-card">
            <div style="font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px;">Всего проектов</div>
            <div style="font-size: 32px; font-weight: 800; margin: 10px 0; font-family: 'Inter', sans-serif;">${total}</div>
            <div style="font-size: 12px; color: #10b981; display: flex; align-items: center; gap: 4px;">
                <span>↑</span> <span>12% за месяц</span>
            </div>
        </div>
        <div class="stat-card">
            <div style="font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px;">В работе</div>
            <div style="font-size: 32px; font-weight: 800; margin: 10px 0; color: #4f46e5;">${active}</div>
            <div style="font-size: 12px; color: #94a3b8;">${pending} ждут модерации</div>
        </div>
        <div class="stat-card" style="border: 1px solid ${isCritical ? '#ef4444' : '#2a2a30'}; background: ${accentBg}; transition: all 0.3s ease;">
            <div style="font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px;">Недобор людей</div>
            <div style="font-size: 32px; font-weight: 800; margin: 10px 0; color: ${accentColor};">${shortage}</div>
            <div style="font-size: 12px; color: ${accentColor}; font-weight: 600;">
                ${shortage > 0 ? '⚠️ Требуется реклама' : '✅ Штат укомплектован'}
            </div>
        </div>
        <div class="stat-card">
            <div style="font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px;">Заполняемость</div>
            <div style="font-size: 32px; font-weight: 800; margin: 10px 0;">${efficiency}%</div>
            <div style="width: 100%; height: 4px; background: #2a2a30; border-radius: 2px; margin-top: 8px;">
                <div style="width: ${efficiency}%; height: 100%; background: #6366f1; border-radius: 2px;"></div>
            </div>
        </div>
    `;
    }

    // === 2. DONUT CHART С УМНЫМ ЦЕНТРАЛЬНЫМ ТЕКСТОМ ===
    function renderProjectDonutChart(projects) {
        const canvas = document.getElementById('projectDonutChart');

        // Если канваса нет в DOM, просто выходим из функции без ошибки
        if (!canvas) {
            console.warn("⚠️ Канвас projectDonutChart не найден. Проверь наличие id в HTML.");
            return;
        }

        const ctx = canvas.getContext('2d');
        const legendContainer = document.getElementById('projectChartLegend');

        const categoryCounts = {};
        projects.forEach(p => {
            const cat = (p.category || 'Другое').trim();
            categoryCounts[cat] = (categoryCounts[cat] || 0) + 1;
        });

        const labels = Object.keys(categoryCounts);
        const data = Object.values(categoryCounts);
        const totalProjects = data.reduce((a, b) => a + b, 0);

        const colors = ['#6366f1', '#10b981', '#f59e0b', '#ec4899', '#8b5cf6', '#06b6d4'];
        const icons = {'Экология': '🌱', 'Животные': '🐾', 'Пожилые': '👴', 'IT': '💻', 'Другое': '📌'};

        // Кастомная легенда с процентами
        if (legendContainer) {
            legendContainer.innerHTML = labels.map((label, i) => {
                const percent = totalProjects > 0 ? Math.round((data[i] / totalProjects) * 100) : 0;
                return `
                <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 4px 0;">
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <div style="width: 8px; height: 8px; border-radius: 50%; background: ${colors[i % colors.length]};"></div>
                        <span style="color: #e1e4e8; font-size: 13px;">${icons[label] || '📍'} ${label}</span>
                    </div>
                    <span style="color: #94a3b8; font-size: 12px; font-weight: 600;">${data[i]} (${percent}%)</span>
                </div>
            `;
            }).join('');
        }

        if (projectDonutChartInstance) projectDonutChartInstance.destroy();

        projectDonutChartInstance = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: labels,
                datasets: [{
                    data: data,
                    backgroundColor: colors,
                    hoverOffset: 15,
                    borderWidth: 0,
                    weight: 2
                }]
            },
            options: {
                cutout: '82%',
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {display: false},
                    tooltip: {
                        backgroundColor: '#1a1a1f',
                        padding: 12,
                        bodyFont: {size: 13},
                        displayColors: false
                    }
                }
            },
            plugins: [{
                id: 'centerText',
                beforeDraw(chart) {
                    const {width, height, ctx} = chart;
                    ctx.restore();
                    ctx.textBaseline = "middle";

                    // Отрисовка числа
                    ctx.font = "bold 32px 'Inter', sans-serif";
                    ctx.fillStyle = "#ffffff";
                    const text = totalProjects.toString();
                    const textX = Math.round((width - ctx.measureText(text).width) / 2);
                    ctx.fillText(text, textX, height / 2 - 5);

                    // Отрисовка подписи
                    ctx.font = "500 12px 'Inter', sans-serif";
                    ctx.fillStyle = "#94a3b8";
                    const subText = "ПРОЕКТОВ";
                    const subTextX = Math.round((width - ctx.measureText(subText).width) / 2);
                    ctx.fillText(subText, subTextX, height / 2 + 25);
                    ctx.save();
                }
            }]
        });
    }

    // === 3. ТОП-3 ПРОЕКТОВ (ГРАДИЕНТНЫЕ БАРЫ) ===
    function renderTopProjectsWidget(projects) {
        const container = document.getElementById('topProjectsContainer');
        if (!container) return;

        const sorted = [...projects]
            .filter(p => (p.volunteersNeeded || 0) > 0)
            .map(p => {
                const applied = parseInt(p.volunteersApplied) || 0;
                const needed = parseInt(p.volunteersNeeded) || 1;
                return {...p, fillPercent: Math.min(100, Math.round((applied / needed) * 100))};
            })
            .sort((a, b) => b.fillPercent - a.fillPercent)
            .slice(0, 3);

        if (sorted.length === 0) {
            container.innerHTML = '<div style="color: #6b7280; font-size: 13px; text-align: center; padding: 30px;">Нет активных наборов</div>';
            return;
        }

        container.innerHTML = sorted.map(p => `
        <div style="background: rgba(42, 42, 48, 0.5); padding: 14px; border-radius: 12px; border: 1px solid #2a2a30;">
            <div style="display: flex; justify-content: space-between; margin-bottom: 10px; align-items: center;">
                <span style="color: #fff; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 160px;">${p.title}</span>
                <span style="color: #94a3b8; font-size: 11px;">${p.volunteersApplied} / ${p.volunteersNeeded}</span>
            </div>
            <div style="width: 100%; height: 8px; background: #0f0f12; border-radius: 10px; overflow: hidden; position: relative;">
                <div style="width: ${p.fillPercent}%; height: 100%; background: linear-gradient(90deg, #4f46e5, #818cf8); border-radius: 10px; transition: width 1s cubic-bezier(0.22, 1, 0.36, 1);"></div>
            </div>
            <div style="display: flex; justify-content: flex-end; margin-top: 6px;">
                <span style="font-size: 10px; color: ${p.fillPercent >= 100 ? '#10b981' : '#6366f1'}; font-weight: bold;">
                    ${p.fillPercent}% заполнено
                </span>
            </div>
        </div>
    `).join('');
    }

    // === 4. ЛЕНТА СОБЫТИЙ С ЦВЕТОВЫМ КОДИРОВАНИЕМ ===
    function renderActivityFeed(events) {
        const container = document.getElementById('activityFeedContainer');
        if (!container) return;

        if (!events || events.length === 0) {
            container.innerHTML = '<div style="color: #6b7280; font-size: 13px; text-align: center; padding: 20px;">Новых событий пока нет</div>';
            return;
        }

        const formatTimeAgo = (date) => {
            const seconds = Math.floor((new Date() - new Date(date)) / 1000);
            if (seconds < 60) return 'только что';
            const mins = Math.floor(seconds / 60);
            if (mins < 60) return `${mins} мин. назад`;
            const hours = Math.floor(mins / 60);
            if (hours < 24) return `${hours} ч. назад`;
            return new Date(date).toLocaleDateString();
        };

        container.innerHTML = events.slice(0, 10).map(ev => {
            let config = {icon: '⚡', color: '#6366f1'};
            if (ev.type === 'apply') config = {icon: '🙌', color: '#10b981'};
            if (ev.type === 'status_change') config = {icon: '🔄', color: '#f59e0b'};
            if (ev.type === 'new_project') config = {icon: '🆕', color: '#8b5cf6'};

            return `
            <div style="display: flex; gap: 14px; align-items: flex-start; padding: 12px; border-radius: 10px; background: #1a1a1f; margin-bottom: 8px; border-left: 4px solid ${config.color};">
                <div style="font-size: 18px;">${config.icon}</div>
                <div style="flex: 1;">
                    <div style="color: #e1e4e8; font-size: 13px; line-height: 1.5; font-weight: 400;">${ev.text}</div>
                    <div style="color: #64748b; font-size: 11px; margin-top: 5px; display: flex; align-items: center; gap: 5px;">
                        <span style="width: 4px; height: 4px; border-radius: 50%; background: #475569;"></span>
                        ${formatTimeAgo(ev.createdAt)}
                    </div>
                </div>
            </div>
        `;
        }).join('');
    }

    // --- Экспорт сегментов ---
    let currentExportSegment = null;

    async function showExportModal(segmentId, segmentName) {
        currentExportSegment = { id: segmentId, name: segmentName };
        const modal = document.getElementById('exportModal');
        modal.style.display = 'flex';
    }

    async function exportSegment() {
        if (!currentExportSegment) return;
        const format = document.getElementById('exportFormat').value;
        const selectedFields = Array.from(document.querySelectorAll('#exportFields input:checked')).map(cb => cb.value);

        if (selectedFields.length === 0) {
            alert('Выберите хотя бы одно поле для экспорта');
            return;
        }

        try {
            const res = await apiFetch(`/api/admin/export/segments/${currentExportSegment.id}?format=json`);
            if (!res.success) throw new Error(res.error);
            let users = res.users;

            const fieldMap = {
                name: 'Имя',
                email: 'Email',
                city: 'Город',
                role: 'Роль',
                points: 'Баллы (XP)',
                createdAt: 'Дата регистрации',
                lastLogin: 'Последняя активность',
                tasksCompleted: 'Выполнено проектов'
            };

            const exportData = users.map(user => {
                const row = {};
                for (const field of selectedFields) {
                    const label = fieldMap[field];
                    if (field === 'name') row[label] = user.name || user.username || '';
                    else if (field === 'email') row[label] = user.email || '';
                    else if (field === 'city') row[label] = user.city || '';
                    else if (field === 'role') {
                        let roleText = '';
                        if (user.role === 'VOLUNTEER') roleText = 'Волонтёр';
                        else if (user.role === 'ORGANIZER') roleText = 'Организатор';
                        else if (user.role === 'MODERATOR') roleText = 'Модератор';
                        else if (user.role === 'ADMIN') roleText = 'Администратор';
                        else roleText = user.role || '';
                        row[label] = roleText;
                    }
                    else if (field === 'points') row[label] = user.points || 0;
                    else if (field === 'createdAt') {
                        // Пытаемся найти дату в разных вариантах
                        let date = user.createdAt || user.created_at || user.registrationDate || user.registeredAt;
                        if (date) {
                            row[label] = new Date(date).toLocaleDateString('ru-RU');
                        } else {
                            row[label] = '';
                        }
                    }
                    else if (field === 'lastLogin') row[label] = user.lastLogin ? new Date(user.lastLogin).toLocaleString() : '';
                    else if (field === 'tasksCompleted') row[label] = user.tasksCompleted || 0;
                }
                return row;
            });

            const safeName = (currentExportSegment.name || 'segment').replace(/[^a-zа-яё0-9_\-]/gi, '_');

            if (format === 'csv') {
                // Для русскоязычного Excel лучше использовать разделитель ';'
                const delimiter = ';';
                const headers = Object.keys(exportData[0] || {});
                const csvRows = [headers.join(delimiter)];
                for (const row of exportData) {
                    const values = headers.map(header => {
                        let val = row[header] || '';
                        // Экранирование: если содержит разделитель, кавычки или перевод строки, оборачиваем в двойные кавычки
                        if (typeof val === 'string' && (val.includes(delimiter) || val.includes('"') || val.includes('\n'))) {
                            val = '"' + val.replace(/"/g, '""') + '"';
                        }
                        return val;
                    });
                    csvRows.push(values.join(delimiter));
                }
                // Добавляем BOM для корректной кириллицы
                const blob = new Blob(['\uFEFF' + csvRows.join('\n')], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `segment_${safeName}_${Date.now()}.csv`;
                link.click();
                URL.revokeObjectURL(link.href);
            } else if (format === 'xlsx') {
                const wsData = [Object.keys(exportData[0] || [])];
                for (const row of exportData) {
                    wsData.push(Object.values(row));
                }
                const ws = XLSX.utils.aoa_to_sheet(wsData);
                // Автоподбор ширины столбцов
                const colWidths = wsData[0].map((_, idx) => ({ wch: Math.max(15, ...wsData.slice(1).map(r => String(r[idx] || '').length)) }));
                ws['!cols'] = colWidths;
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, 'Segment Data');
                XLSX.writeFile(wb, `segment_${safeName}_${Date.now()}.xlsx`);
            } else if (format === 'pdf') {
                const { jsPDF } = window.jspdf;
                // Устанавливаем шрифт, поддерживающий кириллицу (times работает лучше)
                const doc = new jsPDF('landscape');
                // Пытаемся установить шрифт, поддерживающий кириллицу
                doc.setFont('times');
                doc.setFontSize(16);
                doc.text(`Сегмент: ${currentExportSegment.name}`, 14, 20);
                const headers = Object.keys(exportData[0] || []);
                const rows = exportData.map(row => headers.map(h => row[h] || ''));
                doc.autoTable({
                    head: [headers],
                    body: rows,
                    startY: 30,
                    theme: 'striped',
                    headStyles: { fillColor: [79, 70, 229], textColor: 255, fontStyle: 'bold', font: 'times' },
                    styles: { cellPadding: 3, fontSize: 9, font: 'times' },
                    margin: { left: 14, right: 14 }
                });
                doc.save(`segment_${safeName}_${Date.now()}.pdf`);
            }

            closeExportModal();
        } catch (err) {
            console.error('Export error:', err);
            alert('Ошибка экспорта: ' + err.message);
        }
    }

    function closeExportModal() {
        document.getElementById('exportModal').style.display = 'none';
        currentExportSegment = null;
    }

    // Привязываем кнопки в модалке
    // Привязка обработчиков модального окна экспорта после загрузки DOM
    document.addEventListener('DOMContentLoaded', function() {
        const confirmBtn = document.getElementById('confirmExportBtn');
        const cancelBtn = document.getElementById('cancelExportBtn');
        if (confirmBtn) confirmBtn.onclick = exportSegment;
        if (cancelBtn) cancelBtn.onclick = closeExportModal;
    });

</script>
