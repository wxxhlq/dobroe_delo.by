<!doctype html>
<html lang="ru">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
    <script defer src="https://cloud.umami.is/script.js" data-website-id="f9ad662f-3488-47c5-af79-9b2da5aaeb0f"></script>
  <title>Доброе_дело.by</title>
  <!--марк сучка соснула ручку бем-->
  <style>
    :root {
      --bg: #f6f8fc;
      --surface: #ffffff;
      --surface2: #f9fbff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e6eaf2;

      --blue: #1d4ed8;
      --blue2: #2563eb;
      --blueSoft: #eff6ff;

      --shadow: 0 10px 28px rgba(15, 23, 42, .08);
      --shadow2: 0 16px 44px rgba(15, 23, 42, .14);

      --radius: 18px;
      --radius2: 14px;

      --max: 1700px;
      --pad: 44px;
      /* ~50px, можно 32px если хочешь еще плотнее */
      --font: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans", sans-serif;
    }

    @media (max-width: 900px) {
      :root {
        --pad: 16px;
      }
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      height: 100%
    }

    body {
      margin: 0;
      font-family: var(--font);
      color: var(--text);
      background: var(--bg);
    }

    a {
      color: inherit;
      text-decoration: none
    }

    button,
    input,
    select,
    textarea {
      font: inherit
    }

    .container {
      max-width: var(--max);
      margin: 0 auto;
      padding: 0 var(--pad)
    }

    .muted {
      color: var(--muted)
    }

    .k {
      font-weight: 1000
    }

    .small {
      font-size: 12.5px
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center
    }

    .right {
      margin-left: auto
    }

    .hr {
      height: 1px;
      background: var(--border);
      margin: 14px 0
    }

    /* Top progress */
    .scrollbar {
      position: fixed;
      inset: 0 0 auto 0;
      height: 3px;
      background: var(--blue2);
      transform-origin: left center;
      transform: scaleX(0);
      z-index: 70;
      pointer-events: none;
    }

    /* Header */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 60;
      background: rgba(255, 255, 255, .92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }

    .topbar-inner {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 0
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 1000;
      letter-spacing: .2px
    }

    .logo {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: var(--blue2);
      display: grid;
      place-items: center;
      box-shadow: 0 10px 18px rgba(37, 99, 235, .25);
      overflow: hidden;
    }

    .logo svg {
      width: 20px;
      height: 20px;
      color: #fff
    }

    .nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-left: auto;
      align-items: center
    }

    .chip {
      padding: 8px 10px;
      border-radius: 999px;
      border: 1px solid transparent;
      background: transparent;
      font-weight: 850;
      color: var(--muted);
      cursor: pointer;
      transition: background .14s ease, transform .14s ease, color .14s ease, border-color .14s ease;
    }

    .chip:hover {
      transform: translateY(-1px);
      background: rgba(15, 23, 42, .04)
    }

    .chip.active {
      color: var(--blue);
      background: var(--blueSoft);
      border-color: rgba(29, 78, 216, .18);
    }

    .btn {
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid transparent;
      background: var(--blue2);
      color: #fff;
      font-weight: 950;
      cursor: pointer;
      transition: transform .14s ease, box-shadow .14s ease, background .14s ease;
      box-shadow: 0 14px 28px rgba(37, 99, 235, .20);
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: var(--shadow2);
      background: var(--blue)
    }

    .btn:active {
      transform: translateY(0)
    }

    .btn.secondary {
      background: #fff;
      color: var(--text);
      border-color: var(--border);
      box-shadow: none;
      font-weight: 900;
    }

    .btn.secondary:hover {
      background: var(--surface2)
    }

    .btn.danger {
      background: #fff1f2;
      border-color: #fecdd3;
      color: #9f1239;
      box-shadow: none;
      font-weight: 900;
    }

    .iconbtn {
      padding: 10px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #fff;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: transform .14s ease, background .14s ease, box-shadow .14s ease;
    }

    .iconbtn:hover {
      transform: translateY(-1px);
      background: var(--surface2);
      box-shadow: var(--shadow)
    }

    main {
      padding: 0 0 0
    }

    /* Cards */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .card-inner {
      padding: 16px
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      background: #fff;
      border-radius: var(--radius) var(--radius) 0 0;
    }

    .section-title h2 {
      margin: 0;
      font-size: 16px
    }

    .section-title small {
      color: var(--muted);
      font-weight: 900
    }

    .link {
      color: var(--blue);
      text-decoration: underline;
      cursor: pointer;
      font-weight: 900
    }

    /* Layout */
    .grid {
      display: grid;
      grid-template-columns: 1.15fr .85fr;
      gap: 16px
    }

    @media (max-width: 980px) {
      .grid {
        grid-template-columns: 1fr
      }
    }

    /* ===== FULLSCREEN HERO ===== (text centered; common pattern: image cover + overlay) */
    .hero {
      height: 92vh;
      min-height: 640px;
      max-height: 980px;
      position: relative;
      overflow: hidden;
      border-bottom: 1px solid var(--border);
      background: #0b1226;
    }

    @media (max-width: 980px) {
      .hero {
        height: auto;
        min-height: 0
      }
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: var(--hero-img);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transform: scale(1.03);
      filter: saturate(1.08) contrast(1.05);
      z-index: 0;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(2, 6, 23, .58);
      /* не градиент */
      z-index: 1;
    }

    .hero-inner {
      position: relative;
      z-index: 2;
      height: 100%;
      display: grid;
      align-items: center;
      padding: 18px 0 28px;
    }

    .hero-content {
      display: flex;
      justify-content: center
    }

    .hero-copy {
      text-align: center;
      color: #fff;
      max-width: 80ch;
      margin: 0 auto;
    }

    .hero-copy h1 {
      margin: 0;
      font-size: clamp(36px, 5.2vw, 70px);
      line-height: 1.01;
      letter-spacing: .2px;
      text-wrap: balance;
    }

    .hero-copy p {
      margin: 16px auto 0;
      color: rgba(255, 255, 255, .86);
      line-height: 1.75;
      font-weight: 650;
      font-size: 17px;
      max-width: 62ch;
    }

    .hero-actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .hero-actions .btn.secondary {
      background: rgba(255, 255, 255, .14);
      border-color: rgba(255, 255, 255, .18);
      color: #fff;
    }

    .hero-actions .btn.secondary:hover {
      background: rgba(255, 255, 255, .20);
    }

    .hero-down {
      margin-top: 18px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      color: rgba(255, 255, 255, .82);
      font-weight: 850;
      font-size: 13px;
    }

    .hero-down button {
      border: none;
      background: rgba(255, 255, 255, .12);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, .18);
      border-radius: 999px;
      padding: 10px 12px;
      cursor: pointer;
      transition: transform .14s ease, background .14s ease;
    }

    .hero-down button:hover {
      transform: translateY(-1px);
      background: rgba(255, 255, 255, .18);
    }

    /* Hover feel (card hover: transform + shadow is a standard modern pattern) */
    .project,
    .news-item,
    .step,
    .catcard,
    .feature,
    .quote {
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }

    .project:hover,
    .news-item:hover,
    .step:hover,
    .catcard:hover,
    .feature:hover,
    .quote:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow2);
      border-color: rgba(29, 78, 216, .22);
    }

    /* KPI */
    .kpis {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px
    }

    @media (max-width: 560px) {
      .kpis {
        grid-template-columns: 1fr
      }
    }

    .kpi {
      padding: 14px;
      border-radius: 16px;
      background: #fff;
      border: 1px solid var(--border);
    }

    .kpi .num {
      font-weight: 1000;
      font-size: 26px;
      color: var(--blue)
    }

    .kpi .lab {
      margin-top: 4px;
      color: var(--muted);
      font-weight: 850
    }

    /* Category cards */
    .cats {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      padding: 16px
    }

    @media (max-width: 980px) {
      .cats {
        grid-template-columns: repeat(2, 1fr)
      }
    }

    @media (max-width: 520px) {
      .cats {
        grid-template-columns: 1fr
      }
    }

    .catcard {
      border: 1px solid var(--border);
      border-radius: 18px;
      background: #fff;
      padding: 12px;
      cursor: pointer;
      overflow: hidden;
      position: relative;
      min-height: 110px;
    }

    .catcard::after {
      content: "";
      position: absolute;
      inset: auto -40px -60px auto;
      width: 160px;
      height: 160px;
      border-radius: 999px;
      background: rgba(37, 99, 235, .10);
    }

    .catcard .t {
      font-weight: 1000
    }

    .catcard .d {
      margin-top: 6px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45
    }

    .catbadge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 950;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--blueSoft);
      border: 1px solid rgba(29, 78, 216, .16);
      color: #1e3a8a;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: var(--blue2)
    }

    /* Features block */
    .features {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      padding: 16px
    }

    @media (max-width: 920px) {
      .features {
        grid-template-columns: 1fr
      }
    }

    .feature {
      border: 1px solid var(--border);
      border-radius: 18px;
      background: #fff;
      padding: 14px;
    }

    .feature .icon {
      width: 38px;
      height: 38px;
      border-radius: 14px;
      background: var(--blueSoft);
      border: 1px solid rgba(29, 78, 216, .16);
      display: grid;
      place-items: center;
      color: var(--blue);
      font-weight: 1000;
    }

    .feature .title {
      margin-top: 10px;
      font-weight: 1000
    }

    .feature .text {
      margin-top: 6px;
      color: var(--muted);
      line-height: 1.6;
      font-size: 13.5px
    }

    /* Project cards */
    .project-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px
    }

    @media (max-width: 740px) {
      .project-grid {
        grid-template-columns: 1fr
      }
    }

    .project {
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      background: #fff;
      display: flex;
      flex-direction: column;
      box-shadow: none;
    }

    .pimg {
      height: 350px;
      background: #eaf1ff;
      background-size: cover;
      background-position: center;
      border-bottom: 1px solid var(--border);
      position: relative;
    }

    .flags {
      position: absolute;
      right: 10px;
      top: 10px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .flag {
      font-size: 12px;
      font-weight: 1000;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .92);
      border: 1px solid var(--border);
      color: var(--muted);
      backdrop-filter: blur(8px);
    }

    .flag.urgent {
      border-color: rgba(239, 68, 68, .35);
      color: #991b1b
    }

    .flag.few {
      border-color: rgba(29, 78, 216, .35);
      color: #1d4ed8
    }

    .pbody {
      padding: 12px 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1
    }

    .ptitle {
      margin: 0;
      font-size: 15px;
      font-weight: 1000
    }

    .pdesc {
      margin: 0;
      color: var(--muted);
      line-height: 1.45;
      font-size: 13.5px
    }

    .tagrow {
      display: flex;
      gap: 8px;
      flex-wrap: wrap
    }

    .tag {
      font-size: 12px;
      font-weight: 900;
      padding: 6px 10px;
      border-radius: 999px;
      background: #fff;
      border: 1px solid var(--border);
      color: var(--muted);
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      color: var(--muted);
      font-weight: 850;
      font-size: 13px
    }

    .bar {
      height: 8px;
      background: #eef2ff;
      border-radius: 999px;
      overflow: hidden
    }

    .bar>div {
      height: 100%;
      width: 0%;
      background: var(--blue2);
      transition: width .6s ease
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: auto
    }

    /* News list */
    .list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 16px
    }

    .news-item {
      display: flex;
      gap: 12px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: #fff;
      padding: 12px;
      cursor: pointer;
    }

    .thumb {
      width: 92px;
      height: 72px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background-size: cover;
      background-position: center;
      flex: 0 0 auto;
    }

    .news-item h3 {
      margin: 0;
      font-size: 14px;
      font-weight: 1000
    }

    .news-item p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35
    }

    .news-meta {
      margin-top: 6px;
      color: var(--muted);
      font-size: 12.5px;
      font-weight: 900
    }

    /* Steps */
    .steps {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      padding: 16px
    }

    @media (max-width: 860px) {
      .steps {
        grid-template-columns: 1fr 1fr
      }
    }

    @media (max-width: 480px) {
      .steps {
        grid-template-columns: 1fr
      }
    }

    .step {
      border: 1px solid var(--border);
      border-radius: 18px;
      background: #fff;
      padding: 12px;
    }

    .step .n {
      width: 34px;
      height: 34px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-weight: 1000;
      color: #fff;
      background: var(--blue2);
      margin-bottom: 8px;
    }

    .step .t {
      font-weight: 1000
    }

    .step .d {
      margin-top: 6px;
      color: var(--muted);
      line-height: 1.35;
      font-size: 13px
    }

    /* Quotes/testimonials */
    .quotes {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      padding: 16px
    }

    @media (max-width: 980px) {
      .quotes {
        grid-template-columns: 1fr
      }
    }

    .quote {
      border: 1px solid var(--border);
      border-radius: 18px;
      background: #fff;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .quote .q {
      color: var(--muted);
      line-height: 1.7
    }

    .quote .who {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: auto
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background-size: cover;
      background-position: center;
      flex: 0 0 auto;
    }

    /* FAQ */
    details.faq {
      border: 1px solid var(--border);
      border-radius: 16px;
      background: #fff;
      overflow: hidden;
    }

    details.faq+details.faq {
      margin-top: 10px
    }

    details.faq summary {
      list-style: none;
      cursor: pointer;
      padding: 12px 14px;
      font-weight: 1000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    details.faq summary::-webkit-details-marker {
      display: none
    }

    details.faq .ans {
      border-top: 1px solid var(--border);
      padding: 12px 14px;
      color: var(--muted);
      line-height: 1.7;
      background: var(--surface2);
    }

    /* Filters */
    .split {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 16px;
      padding: 16px
    }

    @media (max-width: 980px) {
      .split {
        grid-template-columns: 1fr
      }
    }

    .sidebar {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: #fff;
      padding: 12px;
      box-shadow: none;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin: 10px 0
    }

    label {
      font-weight: 950;
      font-size: 13px
    }

    input,
    select,
    textarea {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      border-radius: 14px;
      padding: 10px 12px;
      outline: none;
    }

    textarea {
      min-height: 100px;
      resize: vertical
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: rgba(29, 78, 216, .35);
      box-shadow: 0 0 0 4px rgba(29, 78, 216, .10);
    }

    .two {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px
    }

    @media (max-width: 560px) {
      .two {
        grid-template-columns: 1fr
      }
    }

    .hint {
      color: var(--muted);
      font-size: 12.5px;
      line-height: 1.45
    }

    /* Modal */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, .55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }

    .modal.open {
      display: flex
    }

    .modal-card {
      width: min(980px, 100%);
      max-height: 86vh;
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 24px 70px rgba(15, 23, 42, .30);
    }

    .modal-head {
      position: sticky;
      top: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      background: #fff;
      z-index: 1;
    }

    .modal-title {
      margin: 0;
      font-size: 15px;
      font-weight: 1000
    }

    .modal-body {
      padding: 16px
    }

    /* Toasts */
    .toast {
      position: fixed;
      right: 12px;
      bottom: 12px;
      width: min(420px, calc(100% - 24px));
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 200;
    }

    .toast .t {
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 16px;
      padding: 12px;
      box-shadow: var(--shadow);
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    .dot2 {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      margin-top: 5px;
      background: var(--blue2)
    }

    .dot2.warn {
      background: #f59e0b
    }

    .dot2.danger {
      background: #ef4444
    }

    .dot2.ok {
      background: #10b981
    }

    /* Table */
    .table {
      width: 100%;
      border-collapse: collapse;
      overflow: hidden;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: #fff;
    }

    .table th,
    .table td {
      padding: 10px 10px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      font-size: 13.5px;
    }

          region: fd.get('region'),
          address: fd.get('address'),
          categoryId: fd.get('categoryId'),
          format: fd.get('format'),
          capacity: Number(fd.get('capacity'))
        };

        try {
          const res = await fetch(`${API_URL}/api/projects/${projectId}`, {
            method: 'PUT',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${authToken}`
            },

          });
          const data = await res.json().catch(() => ({}));

            toast('danger', 'Ошибка', data.message || 'Не удалось обновить проект');
            return;

          if (data.project) {

    function projectCard(p, context = 'default', statusText = '') {
      if (!p) return "";

      // 1. УМНОЕ ОПРЕДЕЛЕНИЕ ПУТИ К КАРТИНКЕ
      let imgUrl = p.image || "";

      // Если картинки нет, подбираем заглушку по категории
      if (!imgUrl) {
        imgUrl = (typeof projectPhoto === 'function' ? projectPhoto(p.categoryId) : 'images/img5.png');
      } else {
        // Если это не Base64 (data:image...) и не http ссылка, и не начинается со слэша
        if (!imgUrl.startsWith('data:') && !imgUrl.startsWith('http') && !imgUrl.startsWith('/') && !imgUrl.startsWith('images/') && !imgUrl.startsWith('img/')) {
          imgUrl = 'images/' + imgUrl; // Добавляем папку images/ по умолчанию
        }
      }

      // 2. ИЗБРАННОЕ (используем state.favorites для консистентности)
      const u = currentUser();
      const favIds = (state.favorites && u) ? (state.favorites[u.id] || []) : [];
      const isFav = favIds.includes(p.id);

      // 3. ПРОГРЕСС
      const total = p.capacity || 1;
      const current = p.approved || 0;
      const progress = Math.min(Math.round((current / total) * 100), 100);

      // 3.1 Человекочитаемый статус
      let statusLabel = '';
      if (typeof statusText === 'string' && statusText.trim()) {
        statusLabel = statusText;
      } else if (p.status === 'CLOSED') {
        statusLabel = 'Набор завершён';
      } else if (p.status === 'PUBLISHED' || !p.status) {
        statusLabel = 'Открыт';
      } else if (p.status === 'DELETED') {
        statusLabel = 'Удалён';
      } else if (p.status) {
        statusLabel = String(p.status);
      }

      // Категория
      const catName = (state.categories || []).find(c => c.id === p.categoryId)?.name || "Проект";

      // Определяем опции меню в зависимости от роли и контекста
      const isOwner = u && p.ownerUserId === u.id;
      const isAdmin = u && u.role === 'ADMIN';
      const isOrganizer = u && u.role === 'ORGANIZER';

            action: `window.cancelAppFromCabinet('${userApplication.id}')`,
            danger: true
          });
        }

        // Для администратора - всегда все опции, для организатора - только для своих проектов
        if (isAdmin || (isOwner && isOrganizer)) {
          menuItems.push({
            text: 'Редактировать',
            action: `window.openProjectEditModal('${p.id}')`,
            danger: false
          });

          if (isClosed) {
            menuItems.push({
              text: 'Открыть набор',
              action: `window.reopenProject('${p.id}')`,
              danger: false
            });
          } else {
            menuItems.push({
              text: 'Закончить набор',
              action: `window.finishProject('${p.id}')`,
              danger: false
            });
          }

          // Только для администратора - удаление

            menuItems.push({
              text: 'Удалить',
              action: `window.deleteProject('${p.id}')`,
              danger: true

      // Используем Date.now() для уникальности каждого экземпляра карточки

      <button class="menu-btn" onclick="event.stopPropagation(); toggleProjectMenu('${menuId}')">

        ${menuItems.map(item => `

                  onclick="event.stopPropagation(); ${item.action}; closeProjectMenu('${menuId}');">
            ${esc(item.text)}

        `).join('')}
      </div>
    ` : '';

      </div>

                body: JSON.stringify({
                    sessionId: localStorage.getItem('sessionId') || 'guest',
                    eventType: type, // Теперь сюда может прийти и 'project_apply'
                    eventData: { projectId: projectId },
                    path: window.location.pathname
                })
            });
            console.log(`✅ Аналитика [${type}]:`, projectId);
        } catch (err) {
            // Ошибка аналитики не должна мешать пользователю
            console.warn('⚠️ Ошибка отправки метрики');
        }

    function toggleFavorite(projectId) {
      if (!requireAuth()) return;
      const u = currentUser();

      const i = state.favorites[u.id].indexOf(projectId);

    function applyToProject(projectId) {
        if (!requireAuth()) return;

        // 1. СРАЗУ ШЛЕМ СИГНАЛ НА СЕРВЕР (Для Хаба)
        if (typeof trackProjectClick === 'function') {
            // Передаем 'project_apply', чтобы админка увидела конверсию
            trackProjectClick(projectId, 'project_apply');
        }

        const u = currentUser();
        const p = state.projects.find(x => x.id === projectId);
        if (!p) { toast("danger", "Ошибка", "Проект не найден."); return; }

        if (p.approved >= p.capacity) {
            toast("warn", "Нет мест", "Набор закрыт.");
            return;
        }

        const exists = state.applications.find(a => a.projectId === projectId && a.userId === u.id && a.status !== "CANCELLED");
        if (exists) {
            toast("warn", "Уже есть", "Вы уже откликались.");
            return;
        }

        // Создаем заявку
        state.applications.unshift({
            id: uid("app"),
            projectId,
            userId: u.id,
            status: "PENDING",
            createdAt: nowISO()
        });

        saveState();
        toast("ok", "Отклик отправлен", "Статус: ожидает подтверждения.");

        // Демо-эффект подтверждения через 850мс
        setTimeout(() => {
            const app = state.applications.find(a => a.projectId === projectId && a.userId === u.id);
            if (!app) return;

            app.status = "APPROVED";
            p.approved = clamp(p.approved + 1, 0, p.capacity);

            if (u.role === "VOLUNTEER") {
                u.points = (u.points || 0) + 5;
            }

            state.messages.unshift({
                id: uid("m"),
                projectId,
                fromId: "system",
                toId: u.id,
                text: `Отклик подтверждён: «${p.title}».`,
                date: nowISO()
            });

            saveState();
            toast("ok", "Подтверждено", "Вы добавлены в участники.");
            renderApp();
        }, 850);
    }

      (function () {

          $("#loginForm").onsubmit = async (e) => {
              e.preventDefault();
              const fd = new FormData(e.target);
              const email = String(fd.get("email")).trim();

              console.log('📤 ЛОГИН:', email);

                  });

                  if (!res.ok) {
                      toast("danger", "Не вошли", data.message || "Неверный логин или пароль.");
                      return;
                  }

                  // --- КРИТИЧЕСКИЕ ИСПРАВЛЕНИЯ ТУТ ---

                  // 1. Сохраняем токены (оба варианта для совместимости)
                  authToken = data.token;
                  localStorage.setItem('authToken', authToken); // Оставляем для старого кода
                  localStorage.setItem('token', data.token);     // ДОБАВЛЯЕМ ДЛЯ АДМИНКИ
                  localStorage.setItem('user', JSON.stringify(data.user)); // ДОБАВЛЯЕМ ДЛЯ ПРОВЕРКИ РОЛИ
                  localStorage.setItem('token', data.token);

                  // 2. Сохраняем объект пользователя целиком в localStorage
                  // Это позволит admin.html сразу понять, кто зашел
                  localStorage.setItem('user', JSON.stringify(data.user));

                  // 3. Синхронизация со стейтом (твой существующий код)
                  let existingUser = state.users.find(u => u.email === data.user.email);

    /* === ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ДЛЯ ГЕЙМИФИКАЦИИ === */


    function calcLevel(points) {
      const pts = Math.max(0, points || 0);

      // 10 чётких ступеней
      const LEVELS = [
        { min: 0, name: "Новичок" },
        { min: 50, name: "Помощник" },
        { min: 100, name: "Участник" },
        { min: 200, name: "Соратник" },
        { min: 300, name: "Активист" },
        { min: 450, name: "Надёжное плечо" },
        { min: 650, name: "Сердце команды" },
        { min: 900, name: "Герой города" },
        { min: 1200, name: "Мастер добра" },
        { min: 1600, name: "Легенда сообщества" }
      ];

      let current = LEVELS[0];
      for (const lvl of LEVELS) {
        if (pts >= lvl.min) current = lvl;
      }

      const currentIndex = LEVELS.indexOf(current);
      const next = LEVELS[currentIndex + 1] || null;

      const from = current.min;
      const to = next ? next.min : from + 400; // бесконечный последний уровень
      const span = to - from;
      const inside = Math.min(Math.max(pts - from, 0), span);
      const percent = span > 0 ? (inside / span) * 100 : 100;

      return { name: current.name, level: currentIndex + 1, next: to, percent };
    }

    /* === ГЕЙМИФИКАЦИЯ: УРОВНИ И ДОСТИЖЕНИЯ === */

    function calcLevel(points) {
      const step = 100;
      const lvl = Math.floor((points || 0) / step) + 1;
      const currentLvlPoints = (points || 0) % step;
      const percent = (currentLvlPoints / step) * 100;

      let name = "Новичок";
      if (lvl >= 5) name = "Активист";
      if (lvl >= 10) name = "Герой";
      if (lvl >= 20) name = "Мастер добра";

      return { name, level: lvl, next: lvl * step, percent };
    }

    async function loadServerSession() {
      if (!authToken) return;

      try {
        const res = await fetch(`${API_URL}/check-session`, {
          headers: { 'Authorization': `Bearer ${authToken}` }
        });

          if (res.ok) {
              const data = await res.json();
              console.log('✓ Сессия восстановлена:', data.user.name);

              // --- 1. КРИТИЧЕСКИЕ СОХРАНЕНИЯ ДЛЯ АДМИНКИ ---
              localStorage.setItem('token', data.token || localStorage.getItem('authToken'));
              localStorage.setItem('authToken', data.token || localStorage.getItem('authToken'));
              localStorage.setItem('user', JSON.stringify(data.user));

              // --- 2. ОБНОВЛЕНИЕ ЛОКАЛЬНОГО СТЕЙТА ---
              let existingUser = state.users.find(u => u.id === data.user.id);

              if (!existingUser) {
                  state.users.push({
                      id: data.user.id,
                      email: data.user.email,
                      name: data.user.name,
                      role: data.user.role,
                      city: data.user.city || '',
                      phone: data.user.phone || '',
                      avatar: data.user.avatarUrl || '',
                      pass: 'restored',
                      points: data.user.points || 0,
                      privacy: 'public',
                      createdAt: data.user.createdAt || new Date().toISOString()
                  });
              } else {
                  existingUser.email = data.user.email;
                  existingUser.name = data.user.name;
                  existingUser.role = data.user.role;
                  existingUser.city = data.user.city || '';
                  existingUser.phone = data.user.phone || '';
                  existingUser.avatar = data.user.avatarUrl || existingUser.avatar || '';
              }

              state.session.userId = data.user.id;
              saveState();

              // --- 3. АКТИВАЦИЯ ВИДЖЕТА ---
              if (typeof createAdminWidget === 'function') {
                  createAdminWidget();
              }

          } else {
              // Если сессия не восстановилась
              const data = await res.json().catch(() => ({}));
              if (typeof handleAuthResponse === 'function') {
                  handleAuthResponse(res, data);
              }
          }
      } catch (err) {
          console.error('❌ Ошибка загрузки сессии:', err);
      }
    } // <--- Финальная скобка всей функции

          }

        // Проекты, которые пришли вместе с откликами, аккуратно вливаем в state.projects

    /* === ЛОГИКА МЕДИА И ПОСТОВ === */
    let tempPostMedia = { type: null, src: null };

    window.handlePostMedia = function (input, type) {
      const file = input.files[0];
      if (!file) return;

      // Проверка на размер (max 2MB для localStorage)
      if (file.size > 2 * 1024 * 1024) {
        alert("Файл слишком большой! Максимум 2МБ.");
        return;
      }

      const reader = new FileReader();
      reader.onload = (e) => {
        tempPostMedia = { type: type, src: e.target.result };
        const prev = $('#postMediaPreview');
        prev.style.display = 'block';
        // Компактное превью в окне создания
        prev.innerHTML = type === 'image'
          ? `<img src="${e.target.result}">`
          : `<video src="${e.target.result}" muted autoplay></video>`;
      };
      reader.readAsDataURL(file);
    };

          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${authToken}`
          },
          body: JSON.stringify({
            text,
            media: tempPostMedia.src ? { ...tempPostMedia } : null
          })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {

    window.vkComment = async function (e, postId) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        const text = e.target.value.trim();
        const u = currentUser();
        if (!text || !u) return;
        if (!authToken) {
          toast("error", "Ошибка", "Нужно войти в аккаунт");
          return;
        }

        try {
          const res = await fetch(`${API_URL}/api/community/posts/${postId}/comment`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${authToken}`
            },
            body: JSON.stringify({ text })
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            if (!handleAuthResponse(res, data)) return;
            toast("danger", "Ошибка", data.message || "Не удалось добавить комментарий");
            return;
          }

          e.target.value = "";

          if (data.post && state.posts) {

    // === Загрузка профиля с сервера ===
    async function loadProfileFromServer() {
        const token = authToken || localStorage.getItem('token') || localStorage.getItem('authToken');
        if (!token) return;

        try {
            const res = await fetch(`${API_URL}/me`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });

            if (res.ok) {
                const data = await res.json();

                // 1. Формируем объект
                const userData = {
                    id: data.id || data._id,
                    name: data.name,
                    role: data.role || 'USER',
                    email: data.email,
                    avatar: data.avatarUrl || ''
                };

                // 2. ЗАПИСЫВАЕМ В ЛОКАЛ (для виджета)
                localStorage.setItem('user', JSON.stringify(userData));
                localStorage.setItem('token', token);

                // 3. ЗАПИСЫВАЕМ В СТЕЙТ (чтобы старый код не тупил)
                if (typeof state !== 'undefined') {
                    state.session.userId = userData.id;
                    if (!state.users) state.users = [];
                    const idx = state.users.findIndex(u => u.id === userData.id);
                    if (idx !== -1) state.users[idx] = userData;
                    else state.users.push(userData);

                    // Сохраняем стейт, чтобы userId зафиксировался
                    if (typeof saveState === 'function') saveState();
                }

                console.log('✅ Данные успешно вбиты в память. Роль:', userData.role);

                // Запускаем виджет
                if (typeof injectAdminPanel === 'function') injectAdminPanel();
            }
        } catch (err) {
            console.error('❌ Ошибка профиля:', err);
        }
    }

                   style="width: 100px; height: 100px; border-radius: 50%; border: 4px solid rgba(255,255,255,0.3); object-fit: cover; margin-bottom: 15px;">
              <h2 style="margin:0; font-size: 28px;">${esc(user.name || 'Пользователь')}</h2>
              <div style="opacity:0.9; font-size:16px; margin-top: 8px;">${user.points || 0} XP</div>
            </div>
            
            <div style="padding: 24px;">
              <h3 style="margin-bottom: 16px; font-size: 20px;">🏆 Достижения (${unlockedAchievements.length}/${achievements.length})</h3>
              
              ${unlockedAchievements.length > 0 ? `
                <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); gap: 12px; margin-bottom: 20px;">
                  ${unlockedAchievements.map(a => `
                    <div title="${esc(a.name)}: ${esc(a.desc)}" 
                         style="text-align: center; padding: 12px; background: var(--surface2); border-radius: 12px; cursor: help; transition: transform 0.2s;"
                         onmouseover="this.style.transform='scale(1.1)'" 
                         onmouseout="this.style.transform='scale(1)'">
                      <div style="font-size: 36px;">${a.icon}</div>
                      <div style="font-size: 10px; margin-top: 4px; font-weight: 600; color: var(--muted);">${esc(a.name)}</div>
                    </div>
                  `).join('')}
                </div>
              ` : '<div class="muted" style="text-align: center; padding: 20px;">Пока нет разблокированных достижений</div>'}

              <button class="btn secondary" style="width: 100%; margin-bottom: 12px;" onclick="window.openAchievementsModal('${userId}')">Посмотреть все достижения</button>
              <button class="btn" style="width: 100%;" onclick="closeModal()">Закрыть</button>
            </div>
          </div>
        `;

        showModal(html);
      } catch (err) {
        console.error('❌ Ошибка загрузки профиля:', err);
        toast('danger', 'Ошибка', 'Не удалось загрузить профиль');
      }
    };

  </script>
  <script src="/js/tracker.js"></script>
  <script>
      (function() {
          function checkAdmin() {
              const token = localStorage.getItem('token') || localStorage.getItem('authToken');
              const user = JSON.parse(localStorage.getItem('user') || '{}');

              // Если роль в localStorage или в токене — ADMIN
              if (user.role === 'ADMIN') return true;
              if (token) {
                  try {
                      const payload = JSON.parse(atob(token.split('.')[1]));
                      return payload.role === 'ADMIN';
                  } catch(e) { return false; }
              }
              return false;
          }

          if (checkAdmin()) {
              const btn = document.createElement('div');
              btn.innerHTML = '📈';
              btn.style = "position:fixed; bottom:30px; right:30px; width:66px; height:66px; background:#4F46E5; color:white; border-radius:20px; display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:9999; box-shadow:0 10px 25px rgba(79,70,229,0.5); font-size:28px; transition:0.3s;";
              btn.onclick = () => window.location.href = 'admin.html';
              btn.onmouseover = () => btn.style.transform = "scale(1.1)";
              btn.onmouseout = () => btn.style.transform = "scale(1)";
              document.body.appendChild(btn);
          }
      })();

      (function() {
          async function sendEvent(type, extra = {}) {
              const user = JSON.parse(localStorage.getItem('user') || '{}');
              const data = {
                  eventType: type,
                  path: window.location.pathname,
                  email: user.email || null,
                  timestamp: new Date().toISOString(),
                  userAgent: navigator.userAgent,
                  ...extra
              };
              try {
                  // Отправляем на твой роут аналитики
                  await fetch('/api/v1/analytics/collect', {
                      method: 'POST',
                      headers: { 'Content-Type': 'application/json' },
                      body: JSON.stringify(data)
                  });
              } catch(e) {}
          }
          // Трекаем просмотр страницы при загрузке
          sendEvent('navigation');

          // Перехватываем клики по ссылкам (для SPA)
          window.addEventListener('popstate', () => sendEvent('navigation'));
      })();
  </script>
  <script src="/js/auth-helper.js"></script>

  <script>
      async function trackEvent(type = 'page_view') {
          try {
              const urlParams = new URLSearchParams(window.location.search);

              // Определяем ОС более точно
              let os = "Unknown";
              if (navigator.userAgent.indexOf("Win") != -1) os = "Windows";
              if (navigator.userAgent.indexOf("Mac") != -1) os = "MacOS";
              if (navigator.userAgent.indexOf("Android") != -1) os = "Android";
              if (navigator.userAgent.indexOf("like Mac") != -1) os = "iOS";

              const eventData = {
                  eventType: type,
                  sessionId: localStorage.getItem('active_session') || 's_' + Math.random().toString(36).substr(2, 9),
                  sourceData: {
                      utm_source: urlParams.get('utm_source') || 'direct'
                  },
                  deviceData: {
                      os: os,
                      type: /Mobi|Android/i.test(navigator.userAgent) ? 'mobile' : 'desktop'
                  }
              };

              if (!localStorage.getItem('active_session')) {
                  localStorage.setItem('active_session', eventData.sessionId);
              }

              await fetch('/api/events', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify(eventData)
              });
          } catch (e) { console.error('Analytics error'); }
      }

      // Запускаем при загрузке страницы
      trackEvent('page_view');

      // ТАКЖЕ добавь вызов trackEvent('registration') там, где у тебя
      // происходит успешная регистрация волонтера!
  </script>
