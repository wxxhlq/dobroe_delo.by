<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Доброе_дело.by — Blue UI</title>
<!--марк сучка соснула ручку бем-->
  <style>
    :root{
      --bg: #f6f8fc;
      --surface: #ffffff;
      --surface2: #f9fbff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e6eaf2;

      --blue: #1d4ed8;
      --blue2:#2563eb;
      --blueSoft:#eff6ff;

      --shadow: 0 10px 28px rgba(15,23,42,.08);
      --shadow2: 0 16px 44px rgba(15,23,42,.14);

      --radius: 18px;
      --radius2: 14px;

      --max: 1700px;
      --pad: 44px; /* ~50px, можно 32px если хочешь еще плотнее */
      --font: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans", sans-serif;
    }
    @media (max-width: 900px){
      :root{ --pad: 16px; }
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:var(--font);
      color:var(--text);
      background: var(--bg);
    }

    a{color:inherit; text-decoration:none}
    button,input,select,textarea{font:inherit}
    .container{max-width:var(--max); margin:0 auto; padding:0 var(--pad)}
    .muted{color:var(--muted)}
    .k{font-weight:1000}
    .small{font-size:12.5px}
    .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
    .right{margin-left:auto}
    .hr{height:1px; background: var(--border); margin:14px 0}

    /* Top progress */
    .scrollbar{
      position:fixed; inset:0 0 auto 0;
      height:3px;
      background: var(--blue2);
      transform-origin:left center;
      transform: scaleX(0);
      z-index:70;
      pointer-events:none;
    }

    /* Header */
    .topbar{
      position:sticky; top:0; z-index:60;
      background: rgba(255,255,255,.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    .topbar-inner{display:flex; align-items:center; gap:14px; padding:12px 0}
    .brand{display:flex; align-items:center; gap:10px; font-weight:1000; letter-spacing:.2px}
    .logo{
      width:38px; height:38px;
      border-radius: 12px;
      background: var(--blue2);
      display:grid; place-items:center;
      box-shadow: 0 10px 18px rgba(37,99,235,.25);
      overflow:hidden;
    }
    .logo svg{width:20px; height:20px; color:#fff}

    .nav{display:flex; flex-wrap:wrap; gap:8px; margin-left:auto; align-items:center}

    .chip{
      padding:8px 10px;
      border-radius: 999px;
      border:1px solid transparent;
      background: transparent;
      font-weight:850;
      color: var(--muted);
      cursor:pointer;
      transition: background .14s ease, transform .14s ease, color .14s ease, border-color .14s ease;
    }
    .chip:hover{transform: translateY(-1px); background: rgba(15,23,42,.04)}
    .chip.active{
      color: var(--blue);
      background: var(--blueSoft);
      border-color: rgba(29,78,216,.18);
    }

    .btn{
      padding:10px 14px;
      border-radius: 999px;
      border:1px solid transparent;
      background: var(--blue2);
      color:#fff;
      font-weight:950;
      cursor:pointer;
      transition: transform .14s ease, box-shadow .14s ease, background .14s ease;
      box-shadow: 0 14px 28px rgba(37,99,235,.20);
    }
    .btn:hover{transform: translateY(-1px); box-shadow: var(--shadow2); background: var(--blue)}
    .btn:active{transform: translateY(0)}
    .btn.secondary{
      background: #fff;
      color: var(--text);
      border-color: var(--border);
      box-shadow:none;
      font-weight:900;
    }
    .btn.secondary:hover{background: var(--surface2)}
    .btn.danger{
      background:#fff1f2;
      border-color:#fecdd3;
      color:#9f1239;
      box-shadow:none;
      font-weight:900;
    }
    .iconbtn{
      padding:10px 12px;
      border-radius: 999px;
      border:1px solid var(--border);
      background:#fff;
      font-weight:900;
      cursor:pointer;
      display:flex; align-items:center; gap:8px;
      transition: transform .14s ease, background .14s ease, box-shadow .14s ease;
    }
    .iconbtn:hover{transform: translateY(-1px); background: var(--surface2); box-shadow: var(--shadow)}

    main{padding:0 0 0}

    /* Cards */
    .card{
      background: var(--surface);
      border:1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .card-inner{padding:16px}
    .section-title{
      display:flex; align-items:center; justify-content:space-between; gap:12px;
      padding:14px 16px;
      border-bottom:1px solid var(--border);
      background: #fff;
      border-radius: var(--radius) var(--radius) 0 0;
    }
    .section-title h2{margin:0; font-size:16px}
    .section-title small{color:var(--muted); font-weight:900}
    .link{color:var(--blue); text-decoration: underline; cursor:pointer; font-weight:900}

    /* Layout */
    .grid{display:grid; grid-template-columns: 1.15fr .85fr; gap:16px}
    @media (max-width: 980px){ .grid{grid-template-columns:1fr} }

    /* ===== FULLSCREEN HERO ===== (text centered; common pattern: image cover + overlay) */
    .hero{
      height: 92vh;
      min-height: 640px;
      max-height: 980px;
      position:relative;
      overflow:hidden;
      border-bottom:1px solid var(--border);
      background:#0b1226;
    }
    @media (max-width: 980px){
      .hero{height:auto; min-height: 0}
    }
    .hero::before{
      content:"";
      position:absolute; inset:0;
      background-image: var(--hero-img);
      background-size: cover;
      background-position: center;
      background-repeat:no-repeat;
      transform: scale(1.03);
      filter: saturate(1.08) contrast(1.05);
      z-index:0;
    }
    .hero::after{
      content:"";
      position:absolute; inset:0;
      background: rgba(2,6,23,.58); /* не градиент */
      z-index:1;
    }
    .hero-inner{
      position:relative;
      z-index:2;
      height:100%;
      display:grid;
      align-items:center;
      padding: 18px 0 28px;
    }
    .hero-content{display:flex; justify-content:center}
    .hero-copy{
      text-align:center;
      color:#fff;
      max-width: 80ch;
      margin: 0 auto;
    }
    .hero-copy h1{
      margin:0;
      font-size: clamp(36px, 5.2vw, 70px);
      line-height:1.01;
      letter-spacing:.2px;
      text-wrap: balance;
    }
    .hero-copy p{
      margin:16px auto 0;
      color: rgba(255,255,255,.86);
      line-height:1.75;
      font-weight:650;
      font-size: 17px;
      max-width: 62ch;
    }
    .hero-actions{
      display:flex;
      justify-content:center;
      gap:10px;
      flex-wrap:wrap;
      margin-top:18px;
    }
    .hero-actions .btn.secondary{
      background: rgba(255,255,255,.14);
      border-color: rgba(255,255,255,.18);
      color:#fff;
    }
    .hero-actions .btn.secondary:hover{ background: rgba(255,255,255,.20); }

    .hero-down{
      margin-top: 18px;
      display:flex;
      justify-content:center;
      align-items:center;
      gap:10px;
      color: rgba(255,255,255,.82);
      font-weight:850;
      font-size:13px;
    }
    .hero-down button{
      border:none;
      background: rgba(255,255,255,.12);
      color:#fff;
      border:1px solid rgba(255,255,255,.18);
      border-radius:999px;
      padding:10px 12px;
      cursor:pointer;
      transition: transform .14s ease, background .14s ease;
    }
    .hero-down button:hover{
      transform: translateY(-1px);
      background: rgba(255,255,255,.18);
    }

    /* Hover feel (card hover: transform + shadow is a standard modern pattern) */
    .project, .news-item, .step, .catcard, .feature, .quote{
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }
    .project:hover, .news-item:hover, .step:hover, .catcard:hover, .feature:hover, .quote:hover{
      transform: translateY(-4px);
      box-shadow: var(--shadow2);
      border-color: rgba(29,78,216,.22);
    }

    /* KPI */
    .kpis{display:grid; grid-template-columns: repeat(3,1fr); gap:12px}
    @media (max-width: 560px){ .kpis{grid-template-columns:1fr} }
    .kpi{
      padding:14px;
      border-radius: 16px;
      background: #fff;
      border:1px solid var(--border);
    }
    .kpi .num{font-weight:1000; font-size:26px; color: var(--blue)}
    .kpi .lab{margin-top:4px; color:var(--muted); font-weight:850}

    /* Category cards */
    .cats{display:grid; grid-template-columns: repeat(5,1fr); gap:12px; padding:16px}
    @media (max-width: 980px){ .cats{grid-template-columns: repeat(2,1fr)} }
    @media (max-width: 520px){ .cats{grid-template-columns:1fr} }
    .catcard{
      border:1px solid var(--border);
      border-radius: 18px;
      background:#fff;
      padding:12px;
      cursor:pointer;
      overflow:hidden;
      position:relative;
      min-height: 110px;
    }
    .catcard::after{
      content:"";
      position:absolute;
      inset:auto -40px -60px auto;
      width:160px; height:160px;
      border-radius:999px;
      background: rgba(37,99,235,.10);
    }
    .catcard .t{font-weight:1000}
    .catcard .d{margin-top:6px; color:var(--muted); font-size:13px; line-height:1.45}
    .catbadge{
      display:inline-flex; align-items:center; gap:8px;
      font-size:12px; font-weight:950;
      padding:6px 10px;
      border-radius: 999px;
      background: var(--blueSoft);
      border:1px solid rgba(29,78,216,.16);
      color:#1e3a8a;
    }
    .dot{width:9px; height:9px; border-radius:999px; background: var(--blue2)}

    /* Features block */
    .features{display:grid; grid-template-columns: repeat(3,1fr); gap:12px; padding:16px}
    @media (max-width: 920px){ .features{grid-template-columns:1fr} }
    .feature{
      border:1px solid var(--border);
      border-radius: 18px;
      background:#fff;
      padding:14px;
    }
    .feature .icon{
      width:38px; height:38px;
      border-radius: 14px;
      background: var(--blueSoft);
      border:1px solid rgba(29,78,216,.16);
      display:grid; place-items:center;
      color: var(--blue);
      font-weight:1000;
    }
    .feature .title{margin-top:10px; font-weight:1000}
    .feature .text{margin-top:6px; color:var(--muted); line-height:1.6; font-size:13.5px}

    /* Project cards */
    .project-grid{display:grid; grid-template-columns: repeat(2, 1fr); gap:12px}
    @media (max-width: 740px){ .project-grid{grid-template-columns:1fr} }
    .project{
      border:1px solid var(--border);
      border-radius: 18px;
      overflow:hidden;
      background: #fff;
      display:flex;
      flex-direction:column;
      box-shadow:none;
    }
    .pimg{
      height: 350px;
      background:#eaf1ff;
      background-size: cover;
      background-position:center;
      border-bottom:1px solid var(--border);
      position:relative;
    }
    .flags{
      position:absolute; right:10px; top:10px;
      display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end;
    }
    .flag{
      font-size:12px; font-weight:1000;
      padding:6px 10px;
      border-radius:999px;
      background: rgba(255,255,255,.92);
      border:1px solid var(--border);
      color: var(--muted);
      backdrop-filter: blur(8px);
    }
    .flag.urgent{border-color: rgba(239,68,68,.35); color:#991b1b}
    .flag.few{border-color: rgba(29,78,216,.35); color:#1d4ed8}

    .pbody{padding:12px 12px 14px; display:flex; flex-direction:column; gap:10px; flex:1}
    .ptitle{margin:0; font-size:15px; font-weight:1000}
    .pdesc{margin:0; color: var(--muted); line-height:1.45; font-size:13.5px}

    .tagrow{display:flex; gap:8px; flex-wrap:wrap}
    .tag{
      font-size:12px; font-weight:900;
      padding:6px 10px;
      border-radius: 999px;
      background: #fff;
      border:1px solid var(--border);
      color: var(--muted);
    }
    .meta{display:flex; flex-wrap:wrap; gap:10px; color:var(--muted); font-weight:850; font-size:13px}

    .bar{height:8px; background:#eef2ff; border-radius:999px; overflow:hidden}
    .bar>div{height:100%; width:0%; background: var(--blue2); transition: width .6s ease}

    .actions{display:flex; gap:8px; flex-wrap:wrap; margin-top:auto}

    /* News list */
    .list{display:flex; flex-direction:column; gap:10px; padding:16px}
    .news-item{
      display:flex; gap:12px;
      border:1px solid var(--border);
      border-radius: 18px;
      background: #fff;
      padding:12px;
      cursor:pointer;
    }
    .thumb{
      width:92px; height:72px;
      border-radius: 14px;
      border:1px solid var(--border);
      background-size:cover;
      background-position:center;
      flex:0 0 auto;
    }
    .news-item h3{margin:0; font-size:14px; font-weight:1000}
    .news-item p{margin:6px 0 0; color:var(--muted); font-size:13px; line-height:1.35}
    .news-meta{margin-top:6px; color:var(--muted); font-size:12.5px; font-weight:900}

    /* Steps */
    .steps{display:grid; grid-template-columns: repeat(4, 1fr); gap:12px; padding:16px}
    @media (max-width: 860px){ .steps{grid-template-columns:1fr 1fr} }
    @media (max-width: 480px){ .steps{grid-template-columns:1fr} }
    .step{
      border:1px solid var(--border);
      border-radius: 18px;
      background: #fff;
      padding:12px;
    }
    .step .n{
      width:34px; height:34px; border-radius: 12px;
      display:grid; place-items:center;
      font-weight:1000; color:#fff; background: var(--blue2);
      margin-bottom:8px;
    }
    .step .t{font-weight:1000}
    .step .d{margin-top:6px; color:var(--muted); line-height:1.35; font-size:13px}

    /* Quotes/testimonials */
    .quotes{display:grid; grid-template-columns: repeat(3, 1fr); gap:12px; padding:16px}
    @media (max-width: 980px){ .quotes{grid-template-columns:1fr} }
    .quote{
      border:1px solid var(--border);
      border-radius: 18px;
      background:#fff;
      padding:14px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .quote .q{color:var(--muted); line-height:1.7}
    .quote .who{display:flex; align-items:center; gap:10px; margin-top:auto}
    .avatar{
      width:40px; height:40px;
      border-radius: 999px;
      border:1px solid var(--border);
      background-size:cover;
      background-position:center;
      flex: 0 0 auto;
    }

    /* FAQ */
    details.faq{
      border:1px solid var(--border);
      border-radius: 16px;
      background:#fff;
      overflow:hidden;
    }
    details.faq + details.faq{margin-top:10px}
    details.faq summary{
      list-style:none;
      cursor:pointer;
      padding:12px 14px;
      font-weight:1000;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }
    details.faq summary::-webkit-details-marker{display:none}
    details.faq .ans{
      border-top:1px solid var(--border);
      padding:12px 14px;
      color:var(--muted);
      line-height:1.7;
      background: var(--surface2);
    }

    /* Filters */
    .split{display:grid; grid-template-columns: 340px 1fr; gap:16px; padding:16px}
    @media (max-width: 980px){ .split{grid-template-columns:1fr} }
    .sidebar{
      border:1px solid var(--border);
      border-radius: var(--radius);
      background: #fff;
      padding:12px;
      box-shadow:none;
    }
    .field{display:flex; flex-direction:column; gap:6px; margin:10px 0}
    label{font-weight:950; font-size:13px}
    input,select,textarea{
      border:1px solid var(--border);
      background: #fff;
      color: var(--text);
      border-radius: 14px;
      padding:10px 12px;
      outline:none;
    }
    textarea{min-height:100px; resize:vertical}
    input:focus,select:focus,textarea:focus{
      border-color: rgba(29,78,216,.35);
      box-shadow: 0 0 0 4px rgba(29,78,216,.10);
    }
    .two{display:grid; grid-template-columns:1fr 1fr; gap:12px}
    @media (max-width: 560px){ .two{grid-template-columns:1fr} }
    .hint{color:var(--muted); font-size:12.5px; line-height:1.45}

    /* Modal */
    .modal{
      position:fixed; inset:0;
      background: rgba(15,23,42,.55);
      display:none;
      align-items:center; justify-content:center;
      padding:16px; z-index:100;
    }
    .modal.open{display:flex}
    .modal-card{
      width: min(980px, 100%);
      max-height: 86vh;
      overflow:auto;
      border:1px solid var(--border);
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 24px 70px rgba(15,23,42,.30);
    }
    .modal-head{
      position:sticky; top:0;
      display:flex; justify-content:space-between; align-items:center; gap:10px;
      padding:14px 16px;
      border-bottom:1px solid var(--border);
      background: #fff;
      z-index:1;
    }
    .modal-title{margin:0; font-size:15px; font-weight:1000}
    .modal-body{padding:16px}

    /* Toasts */
    .toast{
      position:fixed; right:12px; bottom:12px;
      width: min(420px, calc(100% - 24px));
      display:flex; flex-direction:column; gap:10px;
      z-index:200;
    }
    .toast .t{
      border:1px solid var(--border);
      background: #fff;
      border-radius: 16px;
      padding:12px;
      box-shadow: var(--shadow);
      display:flex; gap:10px; align-items:flex-start;
    }
    .dot2{width:10px; height:10px; border-radius:999px; margin-top:5px; background: var(--blue2)}
    .dot2.warn{background: #f59e0b}
    .dot2.danger{background: #ef4444}
    .dot2.ok{background: #10b981}

    /* Table */
    .table{
      width:100%;
      border-collapse: collapse;
      overflow:hidden;
      border-radius: 16px;
      border:1px solid var(--border);
      background: #fff;
    }
    .table th,.table td{
      padding:10px 10px;
      border-bottom:1px solid var(--border);
      text-align:left;
      font-size:13.5px;
    }
    .table th{font-weight:1000; background: #f9fafb}
    .table tr:last-child td{border-bottom:none}

    @media (prefers-reduced-motion: reduce){
      *{scroll-behavior:auto!important; transition:none!important; animation:none!important}
    }


        /* === СТИЛИ ДЛЯ НОВОГО КАБИНЕТА === */
    .cab-grid { display: grid; grid-template-columns: 320px 1fr; gap: 24px; align-items: start; }
    @media (max-width: 800px) { .cab-grid { grid-template-columns: 1fr; } }

    /* Карточка профиля слева */
    .profile-card { text-align: center; padding: 24px; position: relative; overflow: hidden; }
    .avatar-wrapper {
      width: 120px; height: 120px; margin: 0 auto 16px; border-radius: 50%;
      position: relative; cursor: pointer; border: 4px solid var(--surface2);
      box-shadow: var(--shadow2); overflow: hidden; group: hover;
    }
    .avatar-wrapper img { width: 100%; height: 100%; object-fit: cover; transition: filter 0.2s; }
    .avatar-wrapper:hover img { filter: brightness(0.7); }
    .avatar-overlay {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #fff; opacity: 0; transition: opacity 0.2s; font-size: 24px; font-weight: bold;
    }
    .avatar-wrapper:hover .avatar-overlay { opacity: 1; }

    .user-name { font-size: 20px; font-weight: 1000; color: var(--text); margin-bottom: 4px; }
    .user-role { 
      display: inline-block; padding: 4px 12px; background: var(--blueSoft); 
      color: var(--blue); border-radius: 99px; font-size: 12px; font-weight: 800; margin-bottom: 16px;
    }

    /* Статистика и Прогресс */
    .level-box { background: var(--surface2); padding: 16px; border-radius: 12px; margin-top: 16px; text-align: left; }
    .stat-row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 13px; font-weight: 700; }
    .progress-container { height: 8px; background: #e2e8f0; border-radius: 99px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, var(--blue), #8b5cf6); width: 0%; transition: width 0.6s ease; }

    /* Сетка статистики */
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px; }
    .stat-card { background: #fff; border: 1px solid var(--border); border-radius: 16px; padding: 16px; text-align: center; }
    .stat-val { font-size: 24px; font-weight: 1000; color: var(--blue); }
    .stat-lbl { font-size: 12px; color: var(--muted); font-weight: 700; margin-top: 4px; }

    /* Форма редактирования */
    .settings-box { padding: 0; background: transparent; border: none; box-shadow: none; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }
    .inp-group label { display: block; margin-bottom: 6px; font-weight: 700; font-size: 13px; color: var(--muted); }
    .inp-modern { 
      width: 100%; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--border); 
      background: var(--surface2); font-weight: 600; transition: all 0.2s;
    }
    .inp-modern:focus { background: #fff; border-color: var(--blue); box-shadow: 0 0 0 4px rgba(29,78,216,0.1); }

        /* === СТИЛИ ДОСТИЖЕНИЙ === */
    .badges-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 12px;
      margin-top: 15px;
    }
    .badge-item {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 16px;

function esc(s){ return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])); }
function fmtDate(iso){ const d=new Date(iso); return d.toLocaleDateString("ru-RU",{year:"numeric",month:"2-digit",day:"2-digit"}); }
function clamp(n,a,b){ return Math.max(a, Math.min(b, n)); }
function nowISO(){ return new Date().toISOString(); }

function loadState(){
  try{
    const raw = localStorage.getItem(LS_KEY); // [file:87]
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function saveState(){
  localStorage.setItem(LS_KEY, JSON.stringify(state)); // [file:87]
}

function toast(type,title,msg){
  const wrap = $("#toasts");
  const el = document.createElement("div");
  el.className="t";
  const dot = document.createElement("div");
  dot.className = "dot2 " + (type==="warn"?"warn": type==="danger"?"danger":"ok");
  const body = document.createElement("div");
  body.innerHTML = `<b>${esc(title)}</b><div class="muted">${esc(msg)}</div>`;
  el.append(dot, body);
  wrap.append(el);
  setTimeout(()=>el.remove(), 3200);
}

/* progress bar */
const sb = $("#scrollbar");
function updateScrollBar(){
  const h = document.documentElement;
  const max = (h.scrollHeight - h.clientHeight) || 1;
  const v = clamp(h.scrollTop / max, 0, 1);
  sb.style.transform = `scaleX(${v})`;
}
document.addEventListener("scroll", updateScrollBar);

/* components */

function projectCard(p) {
    if (!p) return "";

    // 1. ЛОГИКА ПОДКЛЮЧЕНИЯ ФОТО (КАК В ИЗБРАННОМ/КАБИНЕТЕ)
    const cat = (state.categories || []).find(c => c.id === p.categoryId);

    // Формируем путь: если есть http — берем как есть, если нет — добавляем img/,
    // если пусто — вызываем заглушку projectPhoto
    const imgUrl = p.image
        ? (p.image.startsWith('http') ? p.image : 'img/' + p.image)
        : (typeof projectPhoto === 'function' ? projectPhoto(p.categoryId) : 'img/social.jpg');

    // 2. ЛОГИКА ИЗБРАННОГО
    const favorites = JSON.parse(localStorage.getItem('favProjects') || '[]');
    const isFav = favorites.includes(p.id);

    // 3. РАСЧЕТ ПРОГРЕССА
    const total = p.capacity || 1;
    const current = p.approved || 0;
    const progress = Math.min(Math.round((current / total) * 100), 100);

    return `
    <div class="project-card" style="position: relative;">
      <button class="fav-btn ${isFav ? 'active' : ''}"
              onclick="event.stopPropagation(); toggleFavorite('${p.id}')">
        ${isFav ? '❤️' : '🤍'}
      </button>

      <div class="img-wrapper" onclick="openProjectModal('${p.id}')">
        <img src="${imgUrl}"
             alt="${esc(p.title)}"
             onerror="this.onerror=null; this.src='img/social.jpg';">

        <div class="card-tag">${esc(cat?.name || "Проект")}</div>
      </div>

      <div style="padding: 24px; cursor: pointer;" onclick="openProjectModal('${p.id}')">
        <div style="font-size: 12px; color: var(--blue); font-weight: 700; margin-bottom: 8px;">
           📍 ${esc(p.city || 'Город')}
        </div>
        <h3 style="font-weight: 850; font-size: 20px; color: var(--text);">${esc(p.title)}</h3>
        <p style="color: var(--muted); font-size: 14px; margin: 12px 0 20px;">${esc(p.descriptionShort || '')}</p>

        <div class="progress-bar-bg" style="background: #f1f5f9; height: 8px; border-radius: 10px; overflow: hidden; margin-bottom: 10px;">
          <div class="progress-bar-fill" style="width: ${progress}%; background: var(--blue); height: 100%;"></div>
        </div>

        <div style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 700;">
          <span style="color: var(--text);">👥 ${current} / ${total}</span>
          <span style="color: var(--blue);">${progress}%</span>
        </div>
      </div>
    </div>`;
}


function toggleFavorite(id) {
    let favorites = JSON.parse(localStorage.getItem('favProjects') || '[]');
    if (favorites.includes(id)) {
        favorites = favorites.filter(favId => favId !== id);
    } else {
        favorites.push(id);
    }
    localStorage.setItem('favProjects', JSON.stringify(favorites));

    // Если есть функция роутинга или отрисовки, вызываем её
    if (window.location.hash.includes('profile')) {
        renderPersonalCabinet(); // Если мы в личном кабинете
    } else {
        renderHome(); // Если мы на главной
    }
}

function bindProjectButtons(root){
  $$("[data-action]", root).forEach(btn=>{
    btn.addEventListener("click",(e)=>{
      const a=e.currentTarget.dataset.action;
      const id=e.currentTarget.dataset.id;
      if(a==="details") openProjectModal(id);
      if(a==="fav") toggleFavorite(id);
      if(a==="apply") applyToProject(id);
    });
  });
}

function onSubmitHelpForm(e){
  e.preventDefault();
  const fd = new FormData(e.target);
  if(!fd.get("consent")){ toast("warn","Нужно согласие","Отметьте чекбокс."); return; }
  state.helpRequests.unshift({
    id: uid("hr"),
    name: String(fd.get("name")||"").trim(),
    contact: String(fd.get("contact")||"").trim(),
    helpType: String(fd.get("helpType")||"").trim(),
    message: String(fd.get("message")||"").trim(),
    status:"NEW",
    createdAt: nowISO()
  });
  saveState();
  e.target.reset();
  toast("ok","Отправлено","Заявка сохранена (демо).");
}

function toggleFavorite(projectId){
  if(!requireAuth()) return;
  const u=currentUser();
  state.favorites[u.id]=state.favorites[u.id]||[];
  const i=state.favorites[u.id].indexOf(projectId);
  if(i>=0){ state.favorites[u.id].splice(i,1); toast("ok","Избранное","Удалено."); }
  else{ state.favorites[u.id].push(projectId); toast("ok","Избранное","Добавлено."); }
  saveState();
}

function applyToProject(projectId){
  if(!requireAuth()) return;
  const u=currentUser();
  const p=state.projects.find(x=>x.id===projectId);
  if(!p){ toast("danger","Ошибка","Проект не найден."); return; }
  if(p.approved>=p.capacity){ toast("warn","Нет мест","Набор закрыт."); return; }

  const exists=state.applications.find(a=>a.projectId===projectId && a.userId===u.id && a.status!=="CANCELLED");
  if(exists){ toast("warn","Уже есть","Вы уже откликались."); return; }

  state.applications.unshift({ id: uid("app"), projectId, userId:u.id, status:"PENDING", createdAt: nowISO() });
  saveState();
  toast("ok","Отклик отправлен","Статус: ожидает подтверждения (демо).");

  setTimeout(()=>{
    const app = state.applications.find(a=>a.projectId===projectId && a.userId===u.id);
    if(!app) return;
    app.status="APPROVED";
    p.approved = clamp(p.approved+1, 0, p.capacity);
    if(u.role==="VOLUNTEER"){ u.points=(u.points||0)+5; }
    state.messages.unshift({ id: uid("m"), projectId, fromId:"system", toId:u.id, text:`Отклик подтверждён: «${p.title}».`, date: nowISO() });
    saveState();
    toast("ok","Подтверждено","Вы добавлены в участники.");
    renderApp();
  }, 850);
}

          <div class="k">Регистрация</div>
          <form id="regForm" style="margin-top:10px">
            <div class="field">
              <label>Роль</label>
              <select name="role" required>
                <option value="VOLUNTEER" selected>Волонтёр</option>
                <option value="ORGANIZER">Организатор</option>
              </select>
            </div>
            <div class="field"><label>Имя</label><input name="name" required></div>
            <div class="two">
              <div class="field"><label>Email</label><input name="email" type="email" required></div>
              <div class="field"><label>Пароль</label><input name="pass" type="password" required minlength="3"></div>
            </div>
            <div class="field">
              <label class="small"><input type="checkbox" name="consent" required> Согласен(на) с правилами и обработкой данных.</label>
            </div>
            <button class="btn secondary" type="submit">Создать аккаунт</button>
          </form>
        </div>
      </div>
    </div>
  `);

    // === ПЕРЕОПРЕДЕЛЕНИЕ ДЛЯ MONGODB ===
    (function() {
        // Используем глобальные переменные API_URL и authToken

        // Перезаписываем loginForm
        $("#loginForm").onsubmit = async (e) => {
            e.preventDefault();
            const fd = new FormData(e.target);
            const email = String(fd.get("email")).trim();
            const pass = String(fd.get("pass")).trim();

            console.log('📤 ЛОГИН:', email);

            try {
                const res = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password: pass })
                });

                const data = await res.json();
                console.log('📥 Ответ сервера:', data);

                if (!res.ok) {
                    toast("danger", "Не вошли", data.message || "Неверный логин или пароль.");
                    return;
                }

                authToken = data.token;
                localStorage.setItem('authToken', authToken);

                let existingUser = state.users.find(u => u.email === data.user.email);
                if (!existingUser) {
                    state.users.push({
                        id: data.user.id,
                        email: data.user.email,
                        name: data.user.name,
                        role: data.user.role,
                        city: data.user.city || '',
                        phone: data.user.phone || '',
                        pass: pass,
                        points: data.user.points || 0,
                        privacy: 'public',
                        createdAt: new Date().toISOString()
                    });
                }

                state.session.userId = data.user.id;
                saveState();
                closeModal();
                toast("ok", "Вход", `Добро пожаловать, ${data.user.name}!`);
                renderApp();

            } catch (err) {
                console.error('❌ Ошибка:', err);
                toast("danger", "Ошибка", "Сервер недоступен");
            }
        };

        // Перезаписываем regForm
        $("#regForm").onsubmit = async (e) => {
            e.preventDefault();
            const fd = new FormData(e.target);

            if (!fd.get("consent")) {
                toast("warn", "Нужно согласие", "Отметьте чекбокс.");
                return;
            }

            const email = String(fd.get("email")).trim();
            const role = String(fd.get("role"));
            const name = String(fd.get("name")).trim();
            const pass = String(fd.get("pass")).trim();

            console.log('📤 РЕГИСТРАЦИЯ:', { email, name, role });

            try {
                const res = await fetch(`${API_URL}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email,
                        password: pass,
                        name,
                        role,
                        username: email.split('@')[0]
                    })
                });

                const data = await res.json();
                console.log('📥 Ответ сервера:', data);

                if (!res.ok) {
                    toast("warn", "Ошибка", data.message || "Проверьте данные");
                    return;
                }

                authToken = data.token;
                localStorage.setItem('authToken', authToken);

                const newUser = {
                    id: data.user.id,
                    email: data.user.email,
                    name: data.user.name,
                    role: data.user.role,
                    city: data.user.city || '',
                    phone: data.user.phone || '',
                    pass: pass,
                    points: data.user.points || 0,
                    privacy: 'public',
                    createdAt: new Date().toISOString()
                };

                state.users.push(newUser);
                state.session.userId = data.user.id;

                if (role === "ORGANIZER") {
                    state.organizations.push({
                        id: `org-${data.user.id}`,
                        ownerUserId: data.user.id,
                        name: `Организация ${data.user.name}`,
                        status: "PENDING",
                        contacts: data.user.email,
                        rating: 0,
                        createdAt: new Date().toISOString()
                    });
                }

                saveState();
                closeModal();
                toast("ok", "Готово", `Аккаунт создан! Добро пожаловать, ${data.user.name}!`);
                renderApp();

            } catch (err) {
                console.error('❌ Ошибка:', err);
                toast("danger", "Ошибка", "Сервер недоступен");
            }
        };

        // Обработчики форм уже установлены выше
    })();
}

/* ===== ОБНОВЛЕННЫЙ ЛИЧНЫЙ КАБИНЕТ ===== */
/* === ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ДЛЯ ГЕЙМИФИКАЦИИ === */

function calcLevel(points) {
  const step = 100;
  const lvl = Math.floor((points || 0) / step) + 1;
  const currentLvlPoints = (points || 0) % step;
  const percent = (currentLvlPoints / step) * 100;

  let name = "Новичок";
  if (lvl >= 5) name = "Активист";
  if (lvl >= 10) name = "Герой";
  if (lvl >= 20) name = "Мастер добра";

  return { name, level: lvl, next: lvl * step, percent };
}

window.cancelAppFromCabinet = function(appId) {
  if (!confirm("Вы уверены, что хотите отменить заявку?")) return;
  const app = state.applications.find(a => a.id === appId);
  if (app) {
    app.status = "CANCELLED";
    saveState();
    toast("warn", "Отменено", "Заявка отозвана");
    renderCabinet();
  }
};

window.directApply = function(projectId) {
  const u = currentUser();
  if (!u) {
    toast("error", "Ошибка", "Нужна авторизация");
    return;
  }

  // Находим все отклики пользователя на ЭТОТ проект, кроме отмененных
  const hasActiveApp = state.applications.some(a =>
    a.userId === u.id &&
    a.projectId === projectId &&
    a.status !== "CANCELLED"
  );

  if (hasActiveApp) {
    toast("warn", "Внимание", "Вы уже откликнулись на этот проект");
    return;
  }

  // Создаем новый отклик
  const newApp = {
    id: "app-" + Date.now(),
    projectId: projectId,
    userId: u.id,
    date: new Date().toISOString(),
    status: "PENDING"
  };

  state.applications.push(newApp);

  // Начисляем баллы
  u.points = (u.points || 0) + 10;

  saveState();
  toast("ok", "Успешно", "Ваш отклик отправлен!");

  // Обновляем кабинет
  renderCabinet();
};

// Глобальная функция сохранения профиля
window.handleUpdateProfile = async function(form) {
    const u = currentUser();
    if (!u) return;

    const fd = new FormData(form);
    const updateData = {
        name: fd.get('name'),
        city: fd.get('city'),
        phone: fd.get('phone')
    };

    console.log('📤 Отправка данных на сервер:', updateData);

    try {
        const res = await fetch(`http://localhost:3000/me`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${authToken}`
            },
            body: JSON.stringify(updateData)
        });

        const data = await res.json();
        console.log('📥 Ответ сервера:', data);

        if (!res.ok) {
            toast('danger', 'Ошибка', data.message || 'Не удалось обновить');
            return;
        }

        // Обновляем ТОЛЬКО в памяти, БЕЗ localStorage
        Object.assign(u, {
            name: data.user.name,
            city: data.user.city,
            phone: data.user.phone
        });

        // НЕ вызываем saveState() - данные только на сервере!
        toast('ok', '✓', 'Профиль обновлён в БД');
        renderCabinet();

    } catch (err) {
        console.error('❌ Ошибка:', err);
        toast('danger', 'Ошибка', 'Проблема соединения с сервером');
    }
};

// === ЗАГРУЗКА СЕССИИ ПРИ СТАРТЕ ===
async function loadServerSession() {
    if (!authToken) return;

    try {
        const res = await fetch(`${API_URL}/check-session`, {
            headers: { 'Authorization': `Bearer ${authToken}` }
        });

        if (res.ok) {
            const data = await res.json();
            console.log('✓ Сессия восстановлена:', data.user.name);

            let existingUser = state.users.find(u => u.id === data.user.id);
            if (!existingUser) {
                state.users.push({
                    id: data.user.id,
                    email: data.user.email,
                    name: data.user.name,
                    role: data.user.role,
                    city: data.user.city || '',
                    phone: data.user.phone || '',
                    pass: 'restored',
                    points: data.user.points || 0,
                    privacy: 'public',
                    createdAt: new Date().toISOString()
                });
            }

            state.session.userId = data.user.id;
            saveState();
        } else {
            localStorage.removeItem('authToken');
            authToken = null;
        }
    } catch (err) {
        console.error('Ошибка загрузки сессии:', err);
    }
}

let tempPostMedia = { type: null, src: null };

window.handlePostMedia = function(input, type) {
    const file = input.files[0];
    if (!file) return;

    // Проверка на размер (max 2MB для localStorage)
    if (file.size > 2 * 1024 * 1024) {
        alert("Файл слишком большой! Максимум 2МБ.");
        return;
    }

    const reader = new FileReader();
    reader.onload = (e) => {
        tempPostMedia = { type: type, src: e.target.result };
        const prev = $('#postMediaPreview');
        prev.style.display = 'block';
        // Компактное превью в окне создания
        prev.innerHTML = type === 'image'
            ? `<img src="${e.target.result}">`
            : `<video src="${e.target.result}" muted autoplay></video>`;
    };
    reader.readAsDataURL(file);
};

window.submitPost = function() {
    const u = currentUser();
    const text = $('#postText').value.trim();
    if (!text && !tempPostMedia.src) return;
    if (!state.posts) state.posts = [];
    state.posts.unshift({
        id: "post-" + Date.now(),
        userId: u.id,
        userName: u.name,
        userAvatar: u.avatar,
        text: text,
        media: tempPostMedia.src ? { ...tempPostMedia } : null,
        date: new Date().toLocaleString('ru-RU', {hour:'2-digit', minute:'2-digit', day:'numeric', month:'short'}),
        likes: [],
        comments: []
    });
    saveState();
    closePostModal();
    renderCommunity();
};

window.deletePost = function(id) {
    if(confirm("Удалить этот пост?")) {
        state.posts = state.posts.filter(p => p.id !== id);
        saveState();
        renderCommunity();
    }
};

/* === КОММЕНТАРИИ (VK STYLE) === */
window.vkComment = function(e, postId) {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        const text = e.target.value.trim();
        const u = currentUser();
        if (!text || !u) return;

        const post = state.posts.find(p => p.id === postId);
        if (!post.comments) post.comments = [];
        post.comments.push({
            userId: u.id,
            userName: u.name,
            userAvatar: u.avatar,
            text: text,
            date: Date.now()
        });
        e.target.value = "";
        saveState();
        renderCommunity();
    }
};

window.toggleLike = function(postId) {
    const u = currentUser();
    if (!u) return toast("error", "Ошибка", "Нужна авторизация");
    const post = state.posts.find(p => p.id === postId);
    const idx = (post.likes || []).indexOf(u.id);
    if (idx === -1) post.likes.push(u.id);
    else post.likes.splice(idx, 1);
    saveState();
    renderCommunity();
};

            ${u ? `<button class="btn" onclick="openCreateNewsModal()">+ Создать новость</button>` : ''}
        </div>

        <div class="news-grid">
            ${news.length > 0 ? news.map(n => {
                // Проверка: является ли текущий пользователь автором
                const isAuthor = u && u.id === n.authorId;

                return `
                <div class="news-card" style="position: relative;">
                    ${isAuthor ? `
                        <button onclick="deleteNews(event, '${n.id}')"
                            style="position: absolute; top: 15px; right: 15px; z-index: 10; background: rgba(239, 68, 68, 0.9); color: white; border: none; width: 30px; height: 30px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; transition: 0.2s;"
                            onmouseover="this.style.transform='scale(1.1)'"
                            onmouseout="this.style.transform='scale(1)'"
                            title="Удалить новость">
                            ✕
                        </button>
                    ` : ''}

                    <div onclick="openFullNews('${n.id}')" style="height: 100%;">
                        <img src="${n.image}" alt="news">
                        <div class="news-overlay">
                            <div style="font-size: 11px; opacity: 0.8; margin-bottom: 8px;">
                                📅 ${n.date} • ${esc(n.authorName || 'Автор')}
                            </div>
                            <h3 class="news-card-title">${esc(n.title)}</h3>
                        </div>
                    </div>
                </div>
                `;
            }).join('') : `
                <div style="grid-column: 1/-1; text-align: center; padding: 100px 20px; background: var(--surface); border-radius: 20px; border: 2px dashed var(--border);">
                    <h3>Новостей пока нет</h3>
                </div>
            `}
        </div>
    </div>`;
}

window.deleteNews = function(event, newsId) {
    // Останавливаем всплытие, чтобы не сработал onclick основной карточки
    if (event) event.stopPropagation();

    if (!confirm("Вы уверены, что хотите удалить эту новость?")) return;

    // Фильтруем массив, удаляя новость с нужным ID
    state.news = (state.news || []).filter(n => n.id !== newsId);

    saveState();   // Сохраняем в localStorage
    renderNews();  // Перерисовываем экран
    toast("ok", "Удалено", "Новость успешно удалена");
};

// Открытие полной новости в модальном окне
window.openFullNews = function(id) {
    const n = (state.news || []).find(item => item.id === id);

    if (!n) {
        toast("error", "Ошибка", "Не удалось загрузить содержание новости");
        return;
    }

    const html = `
        <div style="max-height: 90vh; overflow-y: auto;">
            <img src="${n.image}" style="width:100%; height:350px; object-fit:cover; border-radius: 18px 18px 0 0;">
            <div style="padding: 30px;">
                <div style="display:flex; justify-content:space-between; color:var(--muted); font-size:13px; margin-bottom:15px;">
                    <span>📅 ${n.date}</span>
                    <span>✍️ ${esc(n.authorName || 'Автор')}</span>
                </div>
                <h2 style="margin-bottom:20px; line-height:1.4; font-size:24px;">${esc(n.title)}</h2>
                <div style="line-height:1.8; font-size:16px; color:var(--text); white-space: pre-wrap;">
                    ${esc(n.text)}
                </div>
                <button class="btn secondary" style="width:100%; margin-top:30px; padding:12px;" onclick="closeModal()">Закрыть</button>
            </div>
        </div>
    `;
    showModal(html);
};

// Окно создания новости (только для ADMIN)
window.openCreateNewsModal = function() {
    const html = `
        <div style="padding: 24px;">
            <h3>Новая публикация</h3>
            <div style="margin-top:20px;">
                <label class="muted" style="font-size:12px;">Заголовок</label>
                <input type="text" id="newsInpTitle" class="inp-modern" style="width:100%; margin-bottom:15px;" placeholder="Введите название...">

                <label class="muted" style="font-size:12px;">Ссылка на обложку (URL)</label>
                <input type="text" id="newsInpImg" class="inp-modern" style="width:100%; margin-bottom:15px;" placeholder="https://...">

                <label class="muted" style="font-size:12px;">Текст новости</label>
                <textarea id="newsInpText" class="inp-modern" style="width:100%; height:200px; resize:none; padding:12px;" placeholder="Напишите содержание..."></textarea>
            </div>
            <div style="display:flex; gap:10px; margin-top:20px;">
                <button class="btn" style="flex:1" onclick="saveAdminNews()">Опубликовать</button>
                <button class="btn secondary" onclick="closeModal()">Отмена</button>
            </div>
        </div>
    `;
    showModal(html);
};

window.saveAdminNews = function() {
    const u = currentUser();
    if (!u) return toast("error", "Ошибка", "Нужно войти в аккаунт");

    const title = $('#newsInpTitle').value.trim();
    const img = $('#newsInpImg').value.trim() || 'https://images.unsplash.com/photo-1517048676732-d65bc937f952?q=80&w=1000';
    const text = $('#newsInpText').value.trim();

    if (!title || !text) {
        toast("error", "Ошибка", "Заполните заголовок и текст новости");
        return;
    }

    if (!state.news) state.news = [];

    // Добавляем новость в начало списка
    state.news.unshift({
        id: 'n-' + Date.now(),
        title: title,
        image: img,
        text: text,
        date: new Date().toLocaleDateString('ru-RU'),
        authorName: u.name,
        authorId: u.id
    });

    saveState();
    closeModal();
    renderNews(); // Перерисовываем страницу новостей
    toast("ok", "Готово", "Ваша новость опубликована!");
};

// === Загрузка профиля с сервера ===
async function loadProfileFromServer() {
    if (!authToken) return;

    console.log('🔄 Загрузка профиля с сервера...');

    try {
        const res = await fetch(`${API_URL}/me`, {
            headers: {
                'Authorization': `Bearer ${authToken}`
            }
        });

        if (res.ok) {
            const data = await res.json();
            console.log('✅ Профиль загружен из БД:', data);

            const u = currentUser();
            if (u) {
                // Обновляем данные в памяти из БД
                Object.assign(u, {
                    name: data.name,
                    city: data.city,
                    phone: data.phone,
                    points: data.points
                });
                // НЕ сохраняем в localStorage!
            }
        }
    } catch (err) {
        console.error('❌ Ошибка загрузки из БД:', err);
    }
}
